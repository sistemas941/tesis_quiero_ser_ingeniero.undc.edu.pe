name: Desplegar en Apache
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: despliegue-apache
  cancel-in-progress: false
jobs:
  pruebas:
    uses: ./.github/workflows/ci.yml
  desplegar:
    needs: pruebas
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: pruebas
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preparar conexión y código del commit probado
        env:
          SSH_CLAVE: ${{ secrets.SSH_CLAVE }}
          SSH_HOSTS: ${{ secrets.SSH_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_CLAVE" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_HOSTS" > ~/.ssh/known_hosts
          git archive --format=tar.gz -o /tmp/qsi.tar.gz "$GITHUB_SHA"
      - name: Transferir y desplegar
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USUARIO: ${{ secrets.SSH_USUARIO }}
          SSH_PUERTO: ${{ secrets.SSH_PUERTO }}
        run: |
          set -euo pipefail
          puerto="${SSH_PUERTO:-2223}"
          destino="$SSH_USUARIO@$SSH_HOST"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$puerto" "$destino" \
            "mkdir -p ~/qsi/releases/$GITHUB_SHA"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -P "$puerto" \
            /tmp/qsi.tar.gz "$destino:qsi/releases/$GITHUB_SHA/codigo.tar.gz"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -p "$puerto" "$destino" \
            "set -eu; cd ~/qsi/releases/$GITHUB_SHA; tar -xzf codigo.tar.gz; bash despliegue/scripts/desplegar-apache.sh $GITHUB_SHA"
      - name: Eliminar credencial temporal
        if: always()
        run: rm -f ~/.ssh/id_ed25519
