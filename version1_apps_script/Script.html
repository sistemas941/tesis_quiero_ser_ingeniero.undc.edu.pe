// A la derecha, la pagina tal como saldra en Word: se actualiza al escribir y lleva a cada campo con un clic.

function modoApp() {
  if (!S.d) return 'sencillo';
  var m = S.modo || leerLocalUsuario('qsi_modo') || S.d.config.MODO_INICIAL;
  return m === 'completo' ? 'completo' : 'sencillo';
}
function ponerModo(m) { S.modo = m; ponerLocal(llaveLocal('qsi_modo'), m); }

function preguntasSencillas() { return (S.d.sencillo || []).filter(function (f) { return aplica(f.aplica); }); }
function respondida(f) {
  if (f.campo === '#biblioteca') return S.d.biblioteca.some(function (b) { return b.uso === 'antecedente'; });
  return String(S.exp[f.campo] || '').trim().length > 0;
}
function progresoSencillo() {
  var ps = preguntasSencillas(), n = ps.filter(respondida).length;
  return { llenas: n, total: ps.length, pct: ps.length ? Math.round(100 * n / ps.length) : 0 };
}

function preguntaHtml(f) {
  if (f.campo === '#biblioteca') {
    var cb = conteoBiblioteca(S.d.biblioteca);
    return '<section class="campo sc" id="c-biblioteca"><div class="fila entre"><div><span class="rotulo">' + esc(f.pregunta) + '</span><p class="ayuda" style="margin-bottom:0">' + esc(f.ayuda) + ' Llevas <b>' + cb.articulos + '</b> art\u00edculos y <b>' + cb.tesis + '</b> tesis.</p></div><button class="btn" data-a="ir" data-v="biblioteca">' + IC.libro + 'Abrir mi biblioteca</button></div></section>';
  }
  var c = campoDe(f.campo);
  if (!c) return '';
  var no = attrIA(), identidad = /^(autor\d|orcid\d|asesor_|coasesor_)/.test(c.clave), acc = '';
  // Pocas ayudas por pregunta: la que mas sirve en cada caso
  if (!identidad && c.clave !== 'linea') {
    acc += '<button class="btn chico fantasma" data-a="ia" data-modo="ayuda" data-campo="' + esc(c.clave) + '"' + no + '>Expl\u00edcame</button>';
    if (c.clave === 'var1') acc += '<button class="btn chico" data-a="desglosar"' + no + '>' + IC.chispa + 'Sacarlas de mi t\u00edtulo</button>';
    else if (c.tipo !== 'opcion' && c.clave !== 'var2') {
      if (c.ia) acc += '<button class="btn chico" data-a="ia" data-modo="proponer" data-campo="' + esc(c.clave) + '"' + no + '>' + IC.chispa + (c.clave === 'titulo' ? 'Mejorar mi t\u00edtulo' : 'Ay\u00fadame a escribirlo') + '</button>';
      else acc += '<button class="btn chico fantasma" data-a="ia" data-modo="preguntar" data-campo="' + esc(c.clave) + '"' + no + '>Hazme preguntas</button>';
      acc += botonHumanizar(c);
      if (c.tipo === 'parrafo') acc += '<button class="btn chico fantasma" data-a="citar" data-campo="' + esc(c.clave) + '">' + IC.libro + 'Citar</button>';
      acc += '<button class="btn chico fantasma" data-a="profundizar" data-campo="' + esc(c.clave) + '" title="Abre esta parte en la ruta completa, con todos sus campos">Profundizar' + IC.flecha + '</button>';
    }
  }
  return '<section class="campo sc" id="c-' + esc(c.clave) + '"><div class="campo-cab">' +
    (c.tipo === 'opcion' ? '<span class="rotulo">' + esc(f.pregunta || etiquetaDe(c)) + '</span>' : '<label for="f-' + esc(c.clave) + '">' + esc(f.pregunta || etiquetaDe(c)) + '</label>') + '</div>' +
    (f.ayuda ? '<p class="ayuda">' + esc(f.ayuda) + '</p>' : '<div style="height:8px"></div>') + controlHtml(c) +
    '<div class="campo-pie"><span class="cuenta" id="n-' + esc(c.clave) + '"></span>' + humChipHtml(humCampo(S.d.humanizacion, c.clave)) + '<span class="acciones">' + acc + '</span></div><div class="obs-campo" id="o-' + esc(c.clave) + '"></div></section>';
}

function formularioTesisHtml() {
  var grupo = null, h = '';
  preguntasSencillas().forEach(function (f) {
    if (f.grupo !== grupo) { grupo = f.grupo; h += '<h2 class="esc-grupo">' + esc(grupo) + '</h2>'; }
    h += preguntaHtml(f);
  });
  h += '<div class="tarjeta plana esc-mas"><h3>\u00bfQuieres profundizar?</h3><p class="tenue pequeno">Con esto ya tienes la base de tu proyecto. La ruta completa agrega el \u00e1rbol de problemas, los objetivos espec\u00edficos, la operacionalizaci\u00f3n, el cronograma, el presupuesto, la revisi\u00f3n con la r\u00fabrica y el visto bueno de tu asesor. Entra cuando quieras: lo que escribiste aqu\u00ed ya estar\u00e1 all\u00e1.</p><div class="fila" style="margin-top:10px"><button class="btn" data-a="modoCompleto">Abrir la ruta completa' + IC.flecha + '</button><button class="btn fantasma" data-a="ir" data-v="orientacion">Ver la orientaci\u00f3n</button></div></div>';
  return h;
}

function progresoHtml() {
  var p = progresoSencillo();
  return '<div class="barra-prog" style="height:6px" role="img" aria-label="' + p.llenas + ' de ' + p.total + ' respuestas"><i style="width:' + p.pct + '%"></i></div><div class="pequeno tenue" style="margin-top:4px">' + (p.llenas === 0 ? 'Empieza por el t\u00edtulo: aparecer\u00e1 en tu car\u00e1tula.' : (p.llenas === p.total ? 'Tienes lo esencial. Desc\u00e1rgalo en Word o profundiza.' : 'Llevas ' + p.llenas + ' de ' + p.total + ' respuestas.')) + '</div>';
}

function vistaTesis() {
  var nombre = String(S.d.perfil.nombre || '').split(' ')[0], vacio = !String(S.exp.titulo || '').trim();
  var h = '<div class="cabecera"><h1>' + (vacio ? 'Hola, ' + esc(nombre) + '. Empecemos por el t\u00edtulo' : 'Mi tesis') + '</h1><p>' + (S.exp._borrador ? 'Tu borrador ya est\u00e1 escrito con la plantilla de la escuela. Aqu\u00ed corriges lo esencial y lo ves cambiar al instante; en \u00abVer mi tesis\u00bb lo revisas secci\u00f3n por secci\u00f3n.' : 'Responde pocas preguntas, en el orden de tu documento. Lo que escribes aparece al instante en tu p\u00e1gina, con la car\u00e1tula y la estructura de la ' + esc(S.d.config.UNIVERSIDAD) + ', y puedes descargarlo en Word cuando quieras.') + '</p></div>' + avisoTitulo() + tarjetaHumHtml();
  var av = miAvance();
  h += '<div class="tarjeta plana mi-avance"><div class="crece"><div class="fila entre pequeno"><b>Tu avance</b><button class="enlace" data-a="ir" data-v="clase">Ver mi clase</button></div>' + barraAvanceHtml(av.pct, av.nivel, true) + '</div><button class="btn" data-a="importar" title="Sube el plan que ya escribiste en Word o PDF">' + IC.subir + 'Importar mi plan</button></div>';
  h += '<div class="escritor" id="escritor"><div class="esc-form pila" id="esc-form">' + formularioTesisHtml() + '</div>';
  h += '<aside class="esc-doc" id="esc-doc" aria-label="Tu documento"><div class="doc-barra"><div class="fila entre"><div><h3 style="margin:0">Tu documento</h3><span class="pequeno tenue" id="doc-estado">Se actualiza mientras escribes</span></div>' +
    '<button class="btn chico ambar" data-a="descargarWord" id="boton-word">' + IC.doc + 'Descargar en Word</button></div><div id="doc-progreso" style="margin-top:8px">' + progresoHtml() + '</div><div id="doc-revision" style="margin-top:8px"></div></div>' +
    '<div class="hojas" id="hojas">' + (S.vistaDoc ? hojasHtml(S.vistaDoc.bloques) : '<div class="pensando" style="padding:30px 10px"><i></i><span>Preparando tu p\u00e1gina\u2026</span></div>') + '</div></aside></div>';
  h += asistenteHtml(true);
  h += '<button class="btn primario boton-doc-movil" data-a="verDoc" id="boton-doc">' + IC.doc + 'Ver mi documento</button>';
  return h;
}

/** Lo que se hace despues de insertar el HTML de la vista. */
function despuesDeTesis() {
  preguntasSencillas().forEach(function (f) { var c = campoDe(f.campo); if (c) pintarCuenta(c); });
  pintarAsistente();
  cargarVista();
  cargarEscudo();
  var primero = preguntasSencillas().filter(function (f) { return f.campo !== '#biblioteca' && !respondida(f); })[0];
  if (primero && primero.campo === 'titulo' && window.innerWidth > 980) { var el = $('#f-titulo'); if (el) el.focus({ preventScroll: true }); }
}
function repintarFormTesis() {
  var f = $('#esc-form');
  if (!f) return;
  var y = window.scrollY;
  f.innerHTML = formularioTesisHtml();
  crecerTodos(f);
  preguntasSencillas().forEach(function (x) { var c = campoDe(x.campo); if (c) pintarCuenta(c); });
  window.scrollTo(0, y);
  aplicarCongelado();
}
function pintarProgreso() { var p = $('#doc-progreso'); if (p) p.innerHTML = progresoHtml(); }

// ------------------------------------------------------------------ la pagina
function enDocumento() { return S.vista === 'tesis' || S.vista === 'documento' || (S.vista === 'alumno' && S.alumnoTab === 'tesis'); }
function cargarVista() {
  // Si nada cambio desde la ultima pagina armada, se reusa sin ir al servidor
  // La pagina ya armada se muestra al instante; igual se pide la ultima al servidor (por si alguien mas la cambio)
  if (S.vista !== 'alumno' && S.vistaDoc && !S.vistaSucia && !Object.keys(S.pend).length) ponerVista(S.vistaDoc);
  var pedido = S.vista === 'alumno' ? llamar('vistaDe', { correo: S.alumno.perfil.correo }) : llamar('vista');
  pedido.then(function (v) { if (enDocumento() && !(S.vista === 'documento' && S.docModo === 'borrador' && planCongelado())) ponerVista(v); }).catch(function (e) {
    var hj = $('#hojas');
    if (hj && !S.vistaDoc) hj.innerHTML = '<div class="aviso rojo" style="margin:14px">No se pudo preparar la p\u00e1gina: ' + esc(e.message) + '</div>';
  });
}
/** Pinta la pagina que llega del servidor sin perder el punto de lectura ni lo que aun no se guardo. */
function ponerVista(v) {
  if (v !== S.vistaDoc) S.vistaSucia = false;
  S.vistaDoc = v;
  var hj = $('#hojas');
  if (!hj) return;
  var y = hj.scrollTop;
  hj.innerHTML = hojasHtml(v.bloques);
  hj.scrollTop = y;
  if (S.vista !== 'alumno') Object.keys(S.pend).forEach(ecoVista);
  var est = $('#doc-estado');
  if (est) est.textContent = S.vista === 'alumno' ? 'As\u00ed est\u00e1 hoy su documento' : (Object.keys(S.pend).length ? 'Escribiendo\u2026' : 'Al d\u00eda con lo que escribiste');
  pintarRevision();
  ponerEscudo();
}

// ------------------------------------------------------------------ revision por secciones
function secciones() { return S.vistaDoc && S.vistaDoc.revision ? S.vistaDoc.revision.secciones : []; }
function seccion(id) { return secciones().filter(function (x) { return x.id === id; })[0]; }
/** Resumen y boton de descarga: verde cuando todo esta revisado, \u00abpor revisar\u00bb mientras falte algo. */
function pintarRevision() {
  var r = S.vistaDoc && S.vistaDoc.revision, b = $('#boton-word'), caja = $('#doc-revision');
  if (!r) return;
  if (S.vista === 'alumno') pintarBloques();
  var falta = r.total - r.revisadas;
  if (b) {
    b.className = 'btn chico ' + (r.completa ? 'verde' : 'ambar');
    b.innerHTML = r.completa ? IC.check + 'Tesis revisada \u00b7 Descargar en Word' : IC.doc + 'Por revisar (' + falta + ') \u00b7 Descargar en Word';
    b.title = r.completa ? 'Todas las secciones est\u00e1n revisadas' : 'Puedes descargarla igual: las secciones sin revisar siguen siendo un borrador';
  }
  if (caja) {
    var dev = secciones().filter(function (x) { return x.estado === 'devuelto'; }).length;
    caja.innerHTML = '<div class="fila entre pequeno"><span>' + (S.vista === 'alumno' ? 'Secciones revisadas' : 'Revisaste') + ' <b>' + r.revisadas + '</b> de ' + r.total + ' secciones' + (dev ? ' \u00b7 <span style="color:var(--rojo)">' + dev + ' devuelta' + (dev > 1 ? 's' : '') + ' por el asesor</span>' : '') + '</span>' +
      (falta && S.vista !== 'alumno' ? '<button class="enlace" data-a="siguienteRevision">Ir a la siguiente por revisar</button>' : '') + '</div><div class="barra-prog verde" style="margin-top:6px"><i style="width:' + Math.round(100 * r.revisadas / Math.max(1, r.total)) + '%"></i></div>';
  }
}
function revHtml(b) {
  var s = seccion(b.id);
  if (!s) return '';
  var asesor = S.vista === 'alumno', soloAsesor = S.d && S.d.config && S.d.config.REVISION_VERDE === 'asesor';
  var h = '<div class="d-rev ' + s.estado + '" data-rev="' + esc(b.id) + '">';
  if (s.estado === 'revisado') h += '<span class="chip verde">' + IC.check + 'Revisado' + (s.por === 'asesor' ? ' por el asesor' : '') + '</span>';
  else if (s.estado === 'devuelto') h += '<span class="chip rojo">Devuelto por ' + (asesor ? (puedeDecidir() ? 'ti' : 'el asesor') : 'tu asesor') + '</span><span class="d-rev-c">' + esc(s.comentario) + '</span>';
  else h += '<span class="chip ambar">Por revisar</span>' + (s.cambio ? '<span class="d-rev-c">Cambi\u00f3 despu\u00e9s de tu revisi\u00f3n</span>' : '');
  if (asesor && !puedeDecidir()) {
    h += '';
  } else if (asesor) {
    h += '<span class="crece"></span>' + (s.estado !== 'revisado' ? '<button class="btn chico" data-a="aprobarSeccion" data-id="' + esc(b.id) + '">' + IC.check + 'Aprobar</button>' : '') + '<button class="btn chico fantasma" data-a="devolverSeccion" data-id="' + esc(b.id) + '">Devolver</button>';
  } else if (!soloAsesor) {
    h += '<span class="crece"></span>' + (s.estado === 'revisado' ? '<button class="enlace" data-a="revisarSeccion" data-id="' + esc(b.id) + '" data-e="quitar">Deshacer</button>' : '<button class="btn chico" data-a="revisarSeccion" data-id="' + esc(b.id) + '" data-e="ok" title="La le\u00edste, la corregiste y est\u00e1s de acuerdo con ella">' + IC.check + (s.estado === 'devuelto' ? 'Ya lo correg\u00ed' : 'Lo revis\u00e9') + '</button>');
  }
  return h + '</div>';
}
function revisarSeccion(id, estado, btn) {
  var fin = ocupar(btn, '');
  guardarAhora().then(function () { return llamar('revisar', { seccion: id, estado: estado }); }).then(function (v) {
    fin();
    ponerVista(v);
    var r = v.revision;
    if (estado === 'ok') toast(r.completa ? '\u00a1Revisaste toda tu tesis! Ya puedes descargarla y envi\u00e1rsela a tu asesor.' : 'Secci\u00f3n revisada. Te faltan ' + (r.total - r.revisadas) + '.', 'bien');
  }).catch(function (e) { fin(); fallo(e); });
}
function siguienteRevision() {
  var s = secciones().filter(function (x) { return x.estado !== 'revisado'; })[0];
  var hj = $('#hojas'), n = s && hj ? $('[data-rev="' + s.id + '"]', hj) : null;
  if (!n) return;
  var dy = n.getBoundingClientRect().top - hj.getBoundingClientRect().top;
  hj.scrollTop += dy - 20;
  n.classList.add('d-foco');
  setTimeout(function () { n.classList.remove('d-foco'); }, 1600);
}
function aprobarSeccion(id, btn) {
  var fin = ocupar(btn, '');
  llamar('revisarAsesor', { correo: S.alumno.perfil.correo, seccion: id, decision: 'aprobar' }).then(function (v) { fin(); ponerVista(v); toast('Secci\u00f3n aprobada.', 'bien'); }).catch(function (e) { fin(); fallo(e); });
}
function devolverSeccion(id) {
  var s = seccion(id);
  modal('<h2>Devolver: ' + esc(s ? s.titulo : id) + '</h2><p class="tenue">El estudiante ver\u00e1 tu comentario en esa secci\u00f3n, en rojo, hasta que la corrija.</p><textarea id="dev-com" rows="4" style="margin-top:10px" placeholder="Qu\u00e9 debe corregir"></textarea>' +
    '<div class="fila" style="justify-content:flex-end;margin-top:12px"><button class="btn" data-a="cerrarModal">Cancelar</button><button class="btn peligro" data-a="confirmarDevolver" data-id="' + esc(id) + '">Devolver la secci\u00f3n</button></div>');
}
function confirmarDevolver(id, btn) {
  var fin = ocupar(btn, 'Devolviendo');
  llamar('revisarAsesor', { correo: S.alumno.perfil.correo, seccion: id, decision: 'devolver', comentario: $('#dev-com').value }).then(function (v) { cerrarModal(); ponerVista(v); toast('Secci\u00f3n devuelta al estudiante.', 'bien'); }).catch(function (e) { fin(); fallo(e); });
}

/** Aviso del titulo ajustado (o propuesto) al cargar el padron. */
function avisoTitulo() {
  var e = S.exp || {};
  if (!e._titulo_motivo) return '';
  var prop = e._titulo_propuesto === 'SI';
  return '<div class="aviso ' + (prop ? 'ambar' : '') + '" style="margin-bottom:16px"><b>' + (prop ? 'Tu t\u00edtulo es una propuesta.' : 'Ajustamos tu t\u00edtulo para que sea de tesis.') + '</b> ' + esc(e._titulo_motivo) +
    (e._titulo_original ? '<div class="pequeno" style="margin-top:6px">T\u00edtulo original: \u00ab' + esc(e._titulo_original) + '\u00bb</div>' : '') + '</div>';
}

/** Ver mi tesis: el documento completo, sus secciones por revisar y la descarga en Word. */
function vistaDocumento() {
  if (!S.docModo) S.docModo = planCongelado() ? 'borrador' : 'plan';
  var borr = planCongelado() && S.docModo === 'borrador';
  var conmuta = planCongelado() ? '<div class="segmentos" style="margin-top:10px"><button class="' + (borr ? '' : 'activo') + '" data-a="docModo" data-m="plan">' + IC.candado + 'Plan aprobado</button><button class="' + (borr ? 'activo' : '') + '" data-a="docModo" data-m="borrador">' + IC.libroAbierto + 'Borrador de tesis</button></div>' : '';
  if (borr) return '<div class="cabecera"><h1>Ver mi tesis</h1><p>As\u00ed va tu borrador de tesis completo, con la estructura del Anexo 6. Haz clic en una secci\u00f3n vac\u00eda para escribirla.</p>' + conmuta + '</div>' + documentoHtml(true);
  var h = '<div class="cabecera"><h1>Ver mi tesis</h1><p>' + (planCongelado() ? 'Tu plan aprobado, tal como qued\u00f3 congelado. Para seguir, pasa al borrador de tesis.' : 'As\u00ed queda tu proyecto con la plantilla de la escuela. Es un borrador: l\u00e9elo secci\u00f3n por secci\u00f3n, corrige lo que haga falta y marca cada una como revisada. Lo resaltado en amarillo son datos que solo t\u00fa puedes conseguir. Cuando todo est\u00e9 en verde, tu tesis est\u00e1 lista para tu asesor.') + '</p>' + conmuta + '</div>' + avisoTitulo();
  return h + '<div id="reglamento" style="margin-bottom:14px"></div>' + documentoHtml(true);
}
function documentoHtml(conDescarga) {
  return '<div class="doc-solo"><aside class="esc-doc" id="esc-doc" aria-label="Documento"><div class="doc-barra"><div class="fila entre"><div><h3 style="margin:0">' + (S.vista === 'alumno' ? 'Su documento' : 'Tu documento') + '</h3><span class="pequeno tenue" id="doc-estado">Preparando\u2026</span></div>' +
    (conDescarga ? (S.docModo === 'borrador' && planCongelado() ? '<button class="btn chico ambar" data-a="infWord" id="boton-word">' + IC.doc + 'Descargar borrador en Word</button>' : '<button class="btn chico ambar" data-a="descargarWord" id="boton-word">' + IC.doc + 'Descargar en Word</button>') : '') + '</div><div id="doc-revision" style="margin-top:8px"></div></div>' +
    '<div class="hojas" id="hojas">' + (S.vistaDoc && S.vista !== 'alumno' && !(S.docModo === 'borrador' && planCongelado()) ? hojasHtml(S.vistaDoc.bloques) : '<div class="pensando" style="padding:30px 10px"><i></i><span>Preparando la p\u00e1gina\u2026</span></div>') + '</div></aside></div>';
}
function cargarEscudo() {
  if (!S.escudo && S.escudo !== false) {
    S.escudo = false;
    llamar('escudo').then(function (r) { S.escudo = r.imagen || false; ponerEscudo(); }).catch(function () { S.escudo = false; });
  }
}
function despuesDeDocumento() {
  if (S.vista !== 'alumno' && S.docModo === 'borrador' && planCongelado()) { cargarBorradorDoc(); return; }
  if (S.vista !== 'alumno') S.vistaDoc = S.vistaDoc || null; cargarVista(); cargarEscudo(); pintarRevision(); cargarReglamento();
}
function ponerEscudo() {
  $$('.d-logo').forEach(function (n) { n.innerHTML = S.escudo ? '<img src="' + esc(S.escudo) + '" alt="Escudo">' : ''; });
}

/** Texto de la pagina con las marcas pendientes resaltadas, como en el documento. */
function nombreCaratula(s) { s = String(s || '').trim(); var i = s.indexOf(','); return i > 0 ? (s.substring(i + 1).trim() + ' ' + s.substring(0, i).trim()).trim() : s; }
function textoDoc(x) {
  return esc(x).replace(/\[(por completar|cita no encontrada)[^\]]*\]/gi, function (m) { return '<span class="d-pend">' + m + '</span>'; });
}
function soloMarca(x) { return /^[\u201c"]?\[por completar:[^\]]*\][\u201d"]?$/i.test(String(x).trim()); }
function textoMarca(x) { var m = /\[por completar:\s*([^\]]*)\]/i.exec(String(x)); var t = m ? m[1].trim() : String(x); return t.charAt(0).toUpperCase() + t.substring(1); }
function irA(clave) { return clave ? ' data-a="docIr" data-c="' + esc(clave) + '"' : ''; }
/** La parte pendiente se llena en este formulario (y no en la ruta completa). */
function esDeAqui(clave) { return !!clave && !!S.d && (S.d.sencillo || []).some(function (f) { return f.campo === clave && aplica(f.aplica); }); }
function vacioHtml(clave, texto, extra, estilo) {
  var aqui = esDeAqui(clave);

    '<p>El avance de todos los tesistas y la actividad de los asesores. Se recalcula cada diez minutos; pulsa Actualizar para ver lo \u00faltimo. ' + (puedeDecidir() ? '' : 'Tu perfil es de solo lectura: puedes abrir cualquier expediente, pero no cambiar su contenido.') + '</p></div>';
  h += '<div class="kpis">' +
    kpiHtml(k.estudiantes, 'Tesistas', k.tesis + ' tesis \u00b7 ' + k.asesores + ' asesores') +
    kpiHtml(pct(k.esenciales), 'Avance medio', 'preguntas esenciales respondidas') +
    kpiHtml(pct(k.revision), 'Revisi\u00f3n media', k.revisionCompleta + ' con la tesis revisada completa') +
    kpiHtml(k.activos7, 'Ingresaron en 7 d\u00edas', Math.round(100 * k.activos7 / n) + ' % del total') +
    kpiHtml(k.nuncaIngresaron, 'Nunca ingresaron', k.clavePendiente + ' con clave inicial pendiente', k.nuncaIngresaron ? 'ambar' : '') +
    kpiHtml(k.inactivos14, 'Sin avanzar 14+ d\u00edas', '', k.inactivos14 ? 'ambar' : '') +
    kpiHtml(k.porRevisar, 'Etapas por revisar', k.devueltas + ' secciones devueltas', k.porRevisar ? 'indigo' : '') +
    kpiHtml(k.planes, 'Planes generados', (SERVIDOR ? 'documento Word' : 'documento Word en Drive')) +
    kpiHtml(k.planesAprobados || 0, 'Planes aprobados', (k.solicitudesPlan || 0) + ' piden cambio \u00b7 ' + (k.palabrasBorrador || 0).toLocaleString('es-PE') + ' palabras de borrador', k.solicitudesPlan ? 'ambar' : (k.planesAprobados ? 'verde' : '')) +
    kpiHtml(k.importaron || 0, 'Importaron su plan', 'avance general medio ' + pct(k.avance), k.importaron ? 'indigo' : '') +
    kpiHtml(k.consultas, 'Consultas a la IA', 'r\u00fabrica media ' + pct(k.rubrica)) +
    kpiHtml((k.focoVerde || 0) + ' / ' + (k.conIA || 0), 'Reelaboraron la IA', (k.focoRojo || 0) + ' con texto casi igual a la IA', k.focoRojo ? 'ambar' : '') +
    '</div>';
  h += embudoHumHtml(t) + '\n';
  // Distribucion del avance
  var tramos = [['0 a 24 %', 0], ['25 a 49 %', 0], ['50 a 74 %', 0], ['75 a 100 %', 0]];
  t.estudiantes.forEach(function (x) { tramos[Math.min(3, Math.floor(x.esenciales / 25))][1]++; });
  var porAsesor = t.asesores.filter(function (a) { return a.estudiantes; }).sort(function (a, b) { return b.esenciales - a.esenciales; }).map(function (a) { return [a.nombre.split(',')[0], a.esenciales, a.estudiantes + ' estudiante' + (a.estudiantes > 1 ? 's' : '') + ', revisi\u00f3n ' + a.revision + ' %']; });
  var v = t.porVia || {};
  h += '<div class="rejilla graficos">' +
    '<div class="tarjeta"><h3>\u00bfCu\u00e1nto llevan escrito?</h3><p class="pequeno tenue">Tesistas seg\u00fan el porcentaje de preguntas esenciales respondidas.</p>' + barrasH(tramos.map(function (x) { return [x[0], x[1]]; }), 0, '') + '</div>' +
    '<div class="tarjeta"><h3>Avance medio por asesor</h3><p class="pequeno tenue">Promedio de lo esencial de sus estudiantes.</p>' + (porAsesor.length ? barrasH(porAsesor, 100, ' %') : '<p class="tenue">Sin asesores con estudiantes asignados.</p>') + '</div>' +
    '<div class="tarjeta"><h3>Ingresos por semana</h3><p class="pequeno tenue">' + (t.accesosDesde ? 'Registrados desde el ' + esc(fechaCorta(t.accesosDesde)) + '.' : 'El registro de ingresos empieza con esta versi\u00f3n: se llenar\u00e1 a medida que entren.') + '</p>' + columnasIngresos(t.semanas) + '</div>' +

    '</div>';
  h += '<div class="tarjeta" style="padding:14px 10px;margin-top:16px"><div class="fila entre" style="padding:0 8px 10px"><h2>Tesistas <span class="pequeno tenue" id="cuenta-tablero" style="font-weight:500">' + estudiantesFiltrados().length + ' de ' + t.estudiantes.length + '</span></h2><input id="buscar-tablero" type="search" placeholder="Buscar estudiante, asesor o t\u00edtulo" value="' + esc(S.buscaTab || '') + '" style="max-width:300px" aria-label="Buscar en el tablero"></div>' +
    '<div class="nav filtros" style="padding:0 8px 10px" aria-label="Filtros">' + FILTROS_TAB.map(function (f) { return '<button data-a="filtroTablero" data-f="' + f[0] + '" class="' + ((S.filtroTab || 'todos') === f[0] ? 'activo' : '') + '">' + f[1] + '</button>'; }).join('') + '</div>' +
    '<div class="desliza" id="tabla-estudiantes">' + tablaEstudiantesHtml() + '</div><p class="pequeno tenue" style="padding:8px 8px 0">Pulsa un encabezado para ordenar. Pulsa una fila para abrir el expediente.</p></div>';
  h += '<div class="tarjeta" style="padding:14px 10px;margin-top:16px"><div style="padding:0 8px 10px"><h2>Asesores</h2><p class="pequeno tenue">Acceso y actividad: ingresos a la aplicaci\u00f3n, decisiones sobre etapas y secciones, y comentarios a sus estudiantes.</p></div><div class="desliza" id="tabla-asesores">' + tablaAsesoresHtml() + '</div></div>';
  return h;
}

/** Copia la tabla de tesistas como texto separado por tabuladores, para pegarla en una hoja de c\u00e1lculo. */
function exportarTablero() {
  var cab = ['Estudiante', 'Correo', 'Asesor', 'Pareja', 'T\u00edtulo', 'Lo esencial %', 'Secciones revisadas', 'Secciones totales', 'Devueltas', 'Etapas por revisar', '\u00daltimo ingreso', 'D\u00edas sin avanzar', 'Ingresos', 'Consultas IA', 'Textos IA reelaborados', 'R\u00fabrica %', 'Plan'];
  var filas = estudiantesFiltrados().map(function (x) {
    return [x.nombre, x.correo, x.asesorNombre, (x.companeros || []).join('; '), x.titulo, x.esenciales, x.revisadas, x.secciones, x.devueltas, x.enRevision, x.ultimoIngreso || 'Nunca', x.dias, x.ingresos, x.consultas, x.reelaboracion && x.reelaboracion.total ? x.reelaboracion.reelaborados + '/' + x.reelaboracion.total : '', x.rubrica, x.plan].map(function (v) { return String(v === undefined ? '' : v).replace(/[\t\n\r]+/g, ' '); }).join('\t');
  });
  var texto = [cab.join('\t')].concat(filas).join('\n');
  modal('<h2>Copiar la tabla</h2><p class="tenue">' + filas.length + ' filas (con el filtro actual). C\u00f3pialas y p\u00e9galas en Google Sheets o Excel.</p><textarea id="tsv-tablero" rows="8" readonly style="margin-top:10px;font-family:var(--mono);font-size:12px;white-space:pre">' + esc(texto) + '</textarea><div class="fila" style="justify-content:flex-end;margin-top:12px"><button class="btn" data-a="cerrarModal">Cerrar</button><button class="btn primario" id="copiar-tsv">' + IC.copiar + 'Copiar</button></div>', true);
  $('#copiar-tsv').addEventListener('click', function () {
    copiarTexto(texto, $('#tsv-tablero')).then(function (ok) { toast(ok ? 'Tabla copiada: p\u00e9gala en una hoja de c\u00e1lculo.' : 'Selecciona el texto y c\u00f3pialo con Ctrl+C.', ok ? 'bien' : ''); });
  });
}

// Informaci\u00f3n al pasar el cursor sobre las barras
(function () {
  var tip = null;
  document.addEventListener('mouseover', function (ev) {
    var el = ev.target.closest ? ev.target.closest('[data-tip]') : null;
    if (!el) { if (tip) tip.hidden = true; return; }
    if (!tip) { tip = document.createElement('div'); tip.className = 'tip'; document.body.appendChild(tip); }
    tip.textContent = el.getAttribute('data-tip');
    tip.hidden = false;
  });
  document.addEventListener('mousemove', function (ev) {
    if (!tip || tip.hidden) return;
    var x = Math.min(ev.clientX + 14, window.innerWidth - tip.offsetWidth - 8);
    tip.style.left = x + 'px';
    tip.style.top = (ev.clientY + 16) + 'px';
  });
})();

/** Embudo l\u00fadico: lo que gener\u00f3 la IA, lo revisado, lo aprobado y lo ya humanizado; con podio y niveles. */
function embudoHumHtml(t) {
  var k = t.kpi, p = function (a, b) { return b ? Math.round(100 * a / b) : 0; };
  var etapas = [
    { ic: IC_HUM.chispa, c: 'violeta', n: (k.humGenerados || 0), u: 'textos', t: 'La IA gener\u00f3', d: (k.palabrasIA || 0).toLocaleString('es-PE') + ' palabras de borrador y propuestas', pct: 100 },
    { ic: IC_HUM.ojo, c: 'cielo', n: (k.secRevisadas || 0), u: 'de ' + (k.secTotal || 0), t: 'Revisado por los tesistas', d: p(k.secRevisadas, k.secTotal) + ' % de las secciones', pct: p(k.secRevisadas, k.secTotal) },
    { ic: IC_HUM.sello, c: 'ambar', n: (k.secAprobadas || 0), u: 'de ' + (k.secTotal || 0), t: 'Aprobado por el asesor', d: p(k.secAprobadas, k.secTotal) + ' % de las secciones', pct: p(k.secAprobadas, k.secTotal) },
    { ic: IC_HUM.listo, c: 'verde', n: (k.humListos || 0), u: 'de ' + (k.humGenerados || 0), t: 'Humanizado y listo', d: (k.palabrasHumanas || 0).toLocaleString('es-PE') + ' palabras escritas a mano \u00b7 ' + (k.humListosEst || 0) + ' tesistas al 100 %', pct: p(k.humListos, k.humGenerados) }
  ];
  var h = '<div class="tarjeta embudo-hum"><div class="fila entre"><div><h2 style="margin:0">De la IA a la voz del tesista</h2><p class="pequeno tenue" style="margin-top:4px">Cu\u00e1nto texto gener\u00f3 la IA, cu\u00e1nto se revis\u00f3 y aprob\u00f3, y cu\u00e1nto ya est\u00e1 reescrito y verificado con palabras propias.</p></div></div><div class="embudo">';
  etapas.forEach(function (e, i) {
    h += (i ? '<span class="embudo-flecha" aria-hidden="true">' + IC.flecha + '</span>' : '') + '<div class="embudo-paso ' + e.c + '" data-tip="' + esc(e.t + ': ' + e.d) + '"><span class="hum-medalla ' + e.c + '">' + e.ic + '</span><div class="embudo-n"><b>' + e.n.toLocaleString('es-PE') + '</b><small>' + esc(e.u) + '</small></div><div class="embudo-t">' + esc(e.t) + '</div><div class="hum-barra"><i class="' + e.c + '" style="width:' + e.pct + '%"></i></div><div class="pequeno tenue">' + esc(e.d) + '</div></div>';
  });
  h += '</div>';
  // Podio y niveles
  var con = t.estudiantes.filter(function (x) { return x.humanizacion && x.humanizacion.generados; });
  var podio = con.slice().sort(function (a, b) { return (b.humanizacion.pct - a.humanizacion.pct) || (b.humanizacion.palabrasHumanas - a.humanizacion.palabrasHumanas); }).filter(function (x) { return x.humanizacion.listos > 0; }).slice(0, 3);
  var niveles = ['semilla', 'brote', 'camino', 'casi', 'listo'].map(function (n) { return { n: n, c: con.filter(function (x) { return x.humanizacion.nivel === n; }).length }; });
  h += '<div class="rejilla dos" style="margin-top:16px;gap:16px"><div><h3>Podio de la humanizaci\u00f3n</h3>' + (podio.length ? '<div class="podio">' + podio.map(function (x, i) {
    return '<div class="podio-p p' + (i + 1) + '" data-a="verAlumno" data-correo="' + esc(x.correo) + '"><span class="medalla m' + (i + 1) + '">' + (i + 1) + '</span><b>' + esc(x.nombre.split(',')[0]) + '</b><small>' + x.humanizacion.pct + ' % \u00b7 ' + x.humanizacion.palabrasHumanas + ' XP</small></div>';
  }).join('') + '</div>' : '<p class="tenue pequeno">A\u00fan nadie humaniz\u00f3 un texto. El primero que lo haga sube al podio.</p>') + '</div>' +
    '<div><h3>Tesistas por nivel</h3><div class="niveles-fila">' + niveles.map(function (x) { return '<div class="nivel-caja ' + NIVEL_HUM[x.n].c + '"><span class="hum-medalla ' + NIVEL_HUM[x.n].c + '">' + IC_HUM[x.n] + '</span><b>' + x.c + '</b><small>' + esc(NIVEL_HUM[x.n].n) + '</small></div>'; }).join('') + '</div></div></div>';
  return h + '</div>';
}

      '<p><b>Aprobaci\u00f3n del plan.</b> La coordinaci\u00f3n (o el administrador) abre el expediente del estudiante y pulsa <b>Aprobar el plan y abrir el borrador</b>. Se guarda una copia fija del Word del plan aprobado, el plan queda <b>congelado</b> (solo lectura en \u00abMi tesis\u00bb, \u00abMi ruta\u00bb y \u00abMatriz\u00bb) y se abre el nivel \u00abBorrador\u00bb en el men\u00fa del estudiante.</p>' +
      '<p><b>Cambios al plan solo si se piden.</b> El estudiante pulsa <b>Solicitar un cambio al plan</b>, marca las secciones y explica el motivo. La coordinaci\u00f3n autoriza solo esas secciones (o explica por qu\u00e9 no) y, cuando el estudiante termina, vuelve a aprobar el plan: queda la versi\u00f3n 2, 3\u2026 con todo el historial.</p>' +
      '<p><b>Borrador con la estructura oficial.</b> Sigue el Anexo 6 del Reglamento de Grados y T\u00edtulos de la UNDC (RCO N.\u00b0 115-2025-UNDC/CO): dedicatoria, agradecimiento, resumen, abstract, introducci\u00f3n, cap\u00edtulos I a VIII (planteamiento, marco te\u00f3rico y emp\u00edrico, hip\u00f3tesis y variables, dise\u00f1o metodol\u00f3gico, resultados, discusi\u00f3n, conclusiones y recomendaciones), referencias y anexos. Las secciones de los cap\u00edtulos I a IV se traen del plan con un clic, con la opci\u00f3n de pasarlas a tiempo pasado (\u00abse aplicar\u00e1\u00bb pasa a \u00abse aplic\u00f3\u00bb).</p>' +
      '<p><b>Mini editor.</b> Barra con negrita, cursiva, subrayado, subt\u00edtulos que se numeran solos (1.1.1, A.), vi\u00f1etas, listas numeradas, cita textual en bloque, citar desde la biblioteca, <b>tablas</b> (con un editor de filas y columnas; formato APA 7), <b>figuras</b> (se suben y se reducen solas, o se deja el espacio para pegarlas en Word) y <b>ecuaciones</b> en LaTeX con vista previa y ejemplos. En el Word, las ecuaciones aparte salen como ecuaciones de Office editables y numeradas. Hay un mini tutorial dentro del editor.</p>' +
      '<p><b>Guardar con bot\u00f3n.</b> Cada secci\u00f3n se carga al abrirla y se guarda con <b>Guardar</b> o <b>Ctrl+S</b>; mientras tanto el texto queda en el navegador, as\u00ed que no se pierde si se corta la conexi\u00f3n. Si la secci\u00f3n se guard\u00f3 desde otra ventana, la aplicaci\u00f3n avisa antes de pisarla.</p>' +
      '<p><b>Consensus primero.</b> En el marco te\u00f3rico, los antecedentes, la metodolog\u00eda, la discusi\u00f3n y las recomendaciones aparece \u00abEvidencia con Consensus\u00bb, con b\u00fasquedas ya armadas desde las variables. Lo elegido entra a la biblioteca y se cita donde est\u00e1 el cursor; en la discusi\u00f3n se arma una <b>tabla de contraste</b> (resultado propio, estudio, hallazgo, coincidencia y explicaci\u00f3n).</p>' +
      '<p><b>Revisi\u00f3n y similitud.</b> El estudiante marca cada secci\u00f3n como \u00ablista para mi asesor\u00bb; el asesor la aprueba o la devuelve con un comentario desde la pesta\u00f1a \u00abBorrador de tesis\u00bb del expediente. \u00abRevisar similitud\u00bb estima los fragmentos de once palabras o m\u00e1s copiados de los res\u00famenes de la biblioteca (m\u00e1ximo 20 % en pregrado). El tablero muestra planes aprobados, pedidos de cambio y el avance del borrador.</p>' +
      '<p><b>Google Sites.</b> La aplicaci\u00f3n se puede insertar en un Google Sites gratuito (Insertar, \u00abPor URL\u00bb, pegar la direcci\u00f3n /exec) para que no aparezca la franja de Apps Script. Se desactiva con PERMITIR_INSERTAR = NO en la hoja Config.</p>' +
      '<h3>Versi\u00f3n 1.5</h3><p><b>Mi clase.</b> Al entrar, el estudiante ve el avance de su promoci\u00f3n, su puesto y los tres primeros en avance general, humanizaci\u00f3n, revisi\u00f3n, aprobaci\u00f3n del asesor y biblioteca. Solo se muestran el nombre y la inicial del apellido.</p>' +
      '<p><b>Barra de avance por nivel.</b> El avance general combina lo esencial escrito, las secciones revisadas y los textos humanizados. Su color indica el nivel: Semilla (gris), Brote (\u00e1mbar), En camino (celeste), Casi listo (violeta) y Listo (verde). Se ve en \u00abMi clase\u00bb, en \u00abMi tesis\u00bb y en los paneles del asesor y del coordinador.</p>' +
      '<p><b>Importar un plan ya escrito.</b> Desde \u00abMi tesis\u00bb, \u00abMi ruta\u00bb o \u00abMi clase\u00bb, pulse <b>Importar mi plan</b> y suba el archivo (Word .docx recomendado, tambi\u00e9n PDF o texto). La aplicaci\u00f3n reconoce las secciones, el t\u00edtulo, las tablas (operacionalizaci\u00f3n, cronograma, presupuesto, t\u00e9rminos) y las referencias; el estudiante revisa a qu\u00e9 campo va cada parte, puede pedir al asistente que las ordene y decide si reemplaza lo ya escrito. Las referencias se verifican con Crossref y entran a la biblioteca. La importaci\u00f3n se puede deshacer, y queda registrada para el asesor y la coordinaci\u00f3n.</p>' +
      '<p><b>Referencias desde un documento.</b> En Biblioteca, pesta\u00f1a \u00abDesde un documento\u00bb, se pega una lista de referencias en cualquier estilo o se sube el archivo donde est\u00e1n. Se separan, se verifican y se agregan con su clave para citar.</p>' +
      '<p><b>Estilo de citas.</b> IEEE viene por defecto; cada estudiante puede cambiar a APA 7, Vancouver o Chicago (autor-fecha) en la Biblioteca o en su configuraci\u00f3n. Las citas del texto y la lista de referencias se rehacen solas. Las tablas y figuras siguen el formato APA 7: \u00abTabla 1\u00bb en negrita, el t\u00edtulo en cursiva y la nota debajo.</p>' +
      '<p><b>La tuerquita.</b> Cada usuario elige el color de la aplicaci\u00f3n y cambia su contrase\u00f1a; el estudiante adem\u00e1s elige su asistente de IA, su asistente favorito para copiar y pegar, su estilo de citas y su forma de trabajo.</p>' +
      '<p><b>Otras IA.</b> En el modo \u00abcopiar y pegar\u00bb sirven Gemini, ChatGPT, Claude, DeepSeek, Kimi y Copilot, con una mini gu\u00eda para cada uno. No necesitan clave.</p>' +
      '<p><b>Clave propia de otros proveedores.</b> En \u00abActivar mi IA\u00bb, tarjeta \u00abMi propia clave de API\u00bb, se elige Gemini, Groq, Claude, Kimi, DeepSeek, OpenAI u OpenRouter. Cada uno trae su enlace y sus pasos: se crea la clave en la p\u00e1gina del proveedor, se pega y se pulsa \u00abProbar y guardar\u00bb. Gemini y Groq tienen nivel gratuito; los dem\u00e1s cobran por uso (las suscripciones de ChatGPT o claude.ai no incluyen la API). Se puede escribir otro modelo en \u00abModelo (opcional)\u00bb. La clave se guarda solo en el navegador del estudiante; el administrador puede cambiar los modelos por defecto en la hoja Config (MODELO_GROQ, MODELO_CLAUDE, MODELO_KIMI, MODELO_DEEPSEEK, MODELO_OPENAI, MODELO_OPENROUTER y sus variantes _LIGERO).</p>' +
      '<p><b>Consensus y estado del arte.</b> En Biblioteca, pesta\u00f1a \u00abConsensus\u00bb, el estudiante pega su clave de la API (se crea gratis en <a href="https://consensus.app/api-mcp/" target="_blank" rel="noopener">consensus.app/api-mcp</a>, pesta\u00f1a \u00abKeys and clients\u00bb; el plan gratuito trae 30 consultas al mes). Busca papers con filtros de a\u00f1o, tipo de estudio y \u00e1rea, o activa la <b>b\u00fasqueda profunda</b> (tres consultas: el tema, sus l\u00edmites y las revisiones). Cada resultado trae su hallazgo clave, el tipo de estudio, el cuartil y las citas. Con \u00abAgregar y armar mi estado del arte\u00bb, las fuentes entran a la biblioteca y el asistente arma la s\u00edntesis, las tendencias, las brechas, las preguntas abiertas, los m\u00e9todos \u00fatiles y la declaraci\u00f3n de brecha, que se guardan en la tesis. El administrador puede poner una clave para todo el curso en las propiedades del script (CONSENSUS_API_KEY). Tambi\u00e9n se pueden importar exportaciones en BibTeX o RIS desde \u00abDesde un documento\u00bb.</p>' +
      '<p><b>Revisi\u00f3n por bloques.</b> En \u00abSu tesis\u00bb, el asesor aprueba o devuelve un cap\u00edtulo completo con un solo comentario, o aprueba de una vez todo lo que el estudiante ya revis\u00f3.</p>' +
      '<p><b>Reglamento de Similitud y Originalidad (RCO N.\u00b0 503-2025-UNDC/CO).</b> En \u00abVer mi tesis\u00bb y en la vista del asesor se verifica: similitud estimada con el texto generado (m\u00e1ximo 20 % en pregrado, Art. 13), fragmentos de m\u00e1s de diez palabras (Art. 12), declaraci\u00f3n del uso de IA (Arts. 5 y 13), citas con su referencia y citas textuales entre comillas (Art. 4) y humanizaci\u00f3n. Lo que el reglamento excluye del an\u00e1lisis (car\u00e1tula, \u00edndice, referencias y anexos) se marca como \u00abpuede no aplicar\u00bb. Es una estimaci\u00f3n interna: no reemplaza el informe del software institucional.</p>';
  }],
  inicio: ['Primer ingreso', function () {
    return '<p>La aplicaci\u00f3n funciona en cualquier navegador moderno (Chrome, Edge, Firefox o Safari), en computadora o celular. No hay que instalar nada.</p>' +
      pasos(['Abra el enlace de la aplicaci\u00f3n que le entreg\u00f3 la coordinaci\u00f3n.', 'Escriba su correo y la <b>clave inicial</b> que le entregaron (su primer apellido en min\u00fasculas y cuatro n\u00fameros, por ejemplo <span class="mono">garcia0427</span>).',
        'La aplicaci\u00f3n le pedir\u00e1 crear una <b>clave propia</b>: al menos 8 caracteres, con letras y n\u00fameros, distinta de la inicial y sin su correo.', 'Desde entonces ingrese siempre con su correo y su clave propia.']) +
      '<div class="aviso gris" style="margin-top:12px"><b>\u00bfOlvid\u00f3 su clave?</b> Pida a su asesor, al asistente o a la coordinaci\u00f3n que la reinicien: recibir\u00e1 una nueva clave inicial y deber\u00e1 cambiarla al entrar. Tras cinco intentos fallidos, el acceso queda en pausa quince minutos.</div>' +
      '<p style="margin-top:12px">Si la coordinaci\u00f3n habilit\u00f3 el registro, tambi\u00e9n puede crear su usuario desde la pesta\u00f1a \u00abSoy nuevo\u00bb con la <b>clave del curso</b>.</p>';
  }],
  estudiante: ['Para estudiantes', function () {
    return '<p>La aplicaci\u00f3n le acompa\u00f1a desde la idea hasta el plan de tesis en Word, con la estructura de la UNDC y la metodolog\u00eda de ciencia del dise\u00f1o.</p>' +
      '<h3>Dos formas de trabajar</h3><div class="rejilla dos" style="gap:12px"><div class="tarjeta plana"><b>Modo sencillo</b><p class="pequeno tenue">Solo las preguntas esenciales, con su tesis a la vista mientras escribe. Recomendado para empezar.</p></div><div class="tarjeta plana"><b>Ruta completa</b><p class="pequeno tenue">Todas las etapas con su revisi\u00f3n, la matriz de consistencia y la r\u00fabrica. Cambie de modo con el bot\u00f3n de la barra superior.</p></div></div>' +
      '<h3>Paso a paso</h3>' + pasos(['<b>Mi tesis:</b> responda las preguntas. Todo se guarda solo; ver\u00e1 \u00abGuardado\u00bb arriba a la derecha.',
        '<b>Biblioteca:</b> agregue sus antecedentes por DOI o b\u00fasqueda. Los datos se verifican en Crossref y OpenAlex; complete la ficha de cada antecedente.',
        '<b>Ver mi tesis:</b> lea el documento armado, revise cada secci\u00f3n y marque \u00abLo revis\u00e9\u00bb. Las secciones que su asesor devuelva aparecen en rojo con su comentario.',
        '<b>R\u00fabrica y matriz:</b> en la ruta completa, compruebe la coherencia de su plan con la r\u00fabrica oficial.',
        '<b>Descargar:</b> genere el plan en Word o PDF cuando quiera; lo pendiente queda resaltado en amarillo.']) +
      '<div class="aviso" style="margin-top:12px">El asistente de IA propone, pero usted decide: cada propuesta que acepta, edita o descarta queda registrada y su asesor puede verlo. Revise siempre lo que propone y declare su uso en el anexo correspondiente.</div>';
  }],
  asesor: ['Para asesores', function () {
    return pasos(['En <b>Estudiantes</b> ve a sus tesistas: lo esencial respondido, secciones revisadas, etapas que esperan su visto bueno y d\u00edas sin actividad.',
      'Pulse un estudiante para abrir su expediente. En la pesta\u00f1a <b>Su tesis</b> lee el documento completo y, en cada secci\u00f3n, puede <b>Aprobar</b> o <b>Devolver</b> con un comentario.',
      'En las pesta\u00f1as de cada etapa aprueba o devuelve la etapa (al devolver, el comentario es obligatorio) o deja un comentario.',
      'En <b>Uso de IA</b> ve cu\u00e1ntas consultas hizo y qu\u00e9 hizo con las propuestas de redacci\u00f3n.',
      'Si su estudiante olvid\u00f3 la clave, use <b>Reiniciar su clave</b> y entr\u00e9guele la clave inicial que aparece.']) +
      '<p class="pequeno tenue" style="margin-top:10px">Solo ve a los estudiantes que tiene asignados. La asignaci\u00f3n la hace la coordinaci\u00f3n o el asistente en Usuarios.</p>';
  }],
  coordinador: ['Para la coordinaci\u00f3n', function () {
    return '<p>El <b>Tablero</b> re\u00fane el avance de todos los tesistas y la actividad de los asesores.</p>' +
      '<h3>Indicadores</h3><div class="pila" style="gap:6px">' + [
        ['Avance medio', 'Porcentaje promedio de preguntas esenciales respondidas.'], ['Revisi\u00f3n media', 'Porcentaje promedio de secciones del documento revisadas.'],
        ['Ingresaron en 7 d\u00edas', 'Tesistas que entraron a la aplicaci\u00f3n en la \u00faltima semana.'], ['Nunca ingresaron', 'A\u00fan no han entrado; normalmente tienen la clave inicial pendiente.'],
        ['Sin avanzar 14+ d\u00edas', 'Tesistas sin cambios en dos semanas o m\u00e1s: conviene contactarlos.'], ['Etapas por revisar', 'Etapas cerradas por el estudiante que esperan la decisi\u00f3n del asesor.'],
        ['Planes generados', 'Tesistas que ya descargaron su plan en Word.'], ['Reelaboraron la IA', 'Foco de reelaboraci\u00f3n: compara el texto actual de cada campo con las propuestas de redacci\u00f3n que la IA dio en la aplicaci\u00f3n. Encendido (verde): reescrito con palabras propias; \u00e1mbar: en parte; apagado (rojo): casi igual a la propuesta. No detecta textos de asistentes externos ni anticipa el resultado de Turnitin.'], ['Consultas a la IA', 'Uso total del asistente, con el detalle por modo en el gr\u00e1fico.']
      ].map(function (x) { return '<div class="dato"><span><b>' + x[0] + '</b></span><span class="pequeno" style="text-align:right;max-width:60%">' + x[1] + '</span></div>'; }).join('') + '</div>' +
      '<h3>Tablas</h3>' + pasos(['Use los filtros (nunca ingresaron, sin avanzar, clave pendiente, con devoluciones\u2026) y el buscador.', 'Pulse un encabezado para ordenar; pulse una fila para abrir el expediente en solo lectura.',
        'La tabla de <b>Asesores</b> muestra su \u00faltimo ingreso, sus ingresos de los \u00faltimos 30 d\u00edas, sus aprobaciones, devoluciones y comentarios, y cu\u00e1ntos de sus estudiantes est\u00e1n inactivos.',
        '<b>Copiar tabla</b> lleva los datos filtrados a Google Sheets o Excel.', 'Los datos se recalculan cada diez minutos; <b>Actualizar</b> los recalcula al momento.']) +
      '<p class="pequeno tenue" style="margin-top:10px">El registro de ingresos empieza con la versi\u00f3n 1.4: los gr\u00e1ficos de acceso se llenan a medida que las personas entran.</p>';
  }],
  asistente: ['Para el asistente: registrar usuarios', function () {
    return pasos(['Abra <b>Usuarios</b> y pulse <b>Nuevo usuario</b>.', 'Escriba el correo y el nombre como \u00abApellidos, Nombres\u00bb (por ejemplo, \u00abGarc\u00eda Torres, Ana\u00bb).',
      'Elija el rol (estudiante o asesor) y, para un estudiante, su asesor.', 'Guarde. La <b>clave inicial</b> aparece en la tabla: entr\u00e9guela a la persona; al entrar deber\u00e1 cambiarla.',
      'Para corregir datos, asignar otro asesor, desactivar a alguien o reiniciar su clave, use <b>Editar</b>.']) +
      '<div class="aviso ambar" style="margin-top:12px">El asistente ve el tablero y los expedientes en <b>solo lectura</b>: no puede aprobar, devolver, comentar ni cambiar el contenido de las tesis, y no puede crear coordinadores ni administradores.</div>';
  }],
  humanizar: ['Humanizar: escribir con voz propia', function () {
    return '<p>Los borradores precargados y las propuestas de la IA son un punto de partida. Antes de presentar la tesis, cada texto generado debe quedar escrito con las palabras del tesista: as\u00ed se apropia de sus ideas y puede defenderlas ante el jurado.</p>' +
      pasos(['En \u00abMi tesis\u00bb o en cada etapa, pulse <b>Humanizar</b> junto al campo (o el bot\u00f3n de la tarjeta \u00abHumaniza tu tesis\u00bb).', 'Lea el texto de referencia; si quiere, oc\u00faltelo para escribir de memoria.',
        'Escr\u00edbalo con sus palabras en la ventana. No se puede pegar: cada palabra cuenta.', 'Cuando los cuatro chequeos se ponen en verde (extensi\u00f3n suficiente, frases repetidas 25 % o menos, citas conservadas y escritura a mano), pulse <b>Verificar y guardar</b>. El servidor vuelve a comprobarlo.']) +
      '<h3>Niveles</h3><div class="fila" style="flex-wrap:wrap;gap:8px">' + ['semilla', 'brote', 'camino', 'casi', 'listo'].map(function (k) { return nivelHtml({ nivel: k, listos: 0, generados: 0, pct: 0 }); }).join('') + '</div>' +
      '<p class="pequeno tenue" style="margin-top:10px">Semilla: a\u00fan nada humanizado \u00b7 Brote: algo \u00b7 En camino: 40 % \u00b7 Casi listo: 80 % \u00b7 \u00a1Listo!: todo. Cada palabra escrita a mano suma 1 XP. La verificaci\u00f3n mide cu\u00e1nto cambi\u00f3 el texto respecto de su origen; no es un detector de IA y no anticipa el resultado de Turnitin.</p>';
  }],
  roles: ['Qu\u00e9 puede hacer cada perfil', function () {
    var si = '<span class="chip verde">' + IC.check + 'S\u00ed</span>', no = '<span class="tenue">No</span>';
    var filas = [
      ['Escribir y editar su propia tesis', si, no, no, no, no],
      ['Ver el avance de sus estudiantes', '-', si, si, si, si],
      ['Ver a todos los estudiantes y el tablero', no, no, si, si, si],
      ['Aprobar o devolver etapas y secciones', no, si, si, no, no],
      ['Comentar a un estudiante', no, si, si, no, no],
      ['Crear estudiantes y asesores', no, no, si, no, si],
      ['Crear asistentes y coordinadores', no, no, si, no, no],
      ['Reiniciar claves', no, 'Sus estudiantes', si, no, 'Estudiantes y asesores'],
      ['Humanizar su texto (reescribir con sus palabras)', si, no, no, no, no],
      ['Ver el estado del sistema y la configuraci\u00f3n', no, no, si, no, no]
    ];
    return '<div class="desliza"><table class="tabla" style="min-width:720px"><thead><tr><th>Acci\u00f3n</th><th>Estudiante</th><th>Asesor</th><th>Administrador</th><th>Coordinador</th><th>Asistente</th></tr></thead><tbody>' +
      filas.map(function (f) { return '<tr><td>' + f[0] + '</td>' + f.slice(1).map(function (c) { return '<td class="pequeno">' + c + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div>';
  }],
  ia: ['C\u00f3mo activar la inteligencia artificial', function () {
    var adm = S.perfil && S.perfil.rol === 'admin';
    return '<p>El asistente puede funcionar de cuatro maneras. La coordinaci\u00f3n decide cu\u00e1les est\u00e1n habilitadas (en la hoja de datos, pesta\u00f1a Config, clave <span class="mono">MODOS_IA</span>); el estudiante elige la suya con el bot\u00f3n del asistente.</p>' +
      '<h3>1. Clave propia de Gemini (recomendada, gratuita)</h3>' + pasos(['Entre a <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a> con su cuenta de Google y acepte las condiciones.',
        'Pulse <b>Crear clave de API</b> (Create API key) y c\u00f3piela.', 'En la aplicaci\u00f3n, abra el asistente, elija <b>Mi propia clave de Gemini</b>, pegue la clave y pulse <b>Probar y guardar</b>.']) +
      '<div class="aviso verde">La clave se guarda <b>solo en su navegador</b>: nunca se almacena en el servidor ni la ve la coordinaci\u00f3n. No la comparta. Si usa una computadora p\u00fablica, pulse \u00abOlvidar mi clave\u00bb al terminar. La capa gratuita de Google tiene l\u00edmites de uso por minuto y por d\u00eda.</div>' +
      '<h3>2. Asistente del curso</h3><p>Usa una sola clave de Gemini para todo el curso, con una cuota diaria por estudiante (<span class="mono">CUOTA_DIARIA</span>). La configura el propietario del proyecto:</p>' +
      pasos(['Cree una clave en <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a> (de preferencia con una cuenta institucional).', 'Abra el proyecto en <a href="https://script.google.com" target="_blank" rel="noopener">script.google.com</a> y vaya a <b>Configuraci\u00f3n del proyecto</b> (el engranaje).',
        'En <b>Propiedades del script</b>, pulse <b>Agregar propiedad</b>: nombre <span class="mono">GEMINI_API_KEY</span>, valor la clave. Guarde.', 'Opcional: agregue <span class="mono">OPENALEX_API_KEY</span> para b\u00fasquedas bibliogr\u00e1ficas con m\u00e1s cupo.', 'Recargue la aplicaci\u00f3n: en Administraci\u00f3n, Sistema mostrar\u00e1 \u00abClave configurada\u00bb.']) +

// ------------------------------------------------------------------ comparaci\u00f3n en el navegador (igual que el servidor)
function palabrasHum(t) {
  return sinTildes(String(t || '').toLowerCase()).replace(/\[@[^\]]*\]/g, ' ').replace(/[^a-z0-9\u00f1]+/g, ' ').trim().split(/\s+/).filter(function (w) { return w; });
}
function tejasHum(t) { var w = palabrasHum(t), o = {}; for (var i = 0; i + 4 <= w.length; i++) o[w.slice(i, i + 4).join(' ')] = 1; return o; }
function coincidenciaHum(a, b) { var A = tejasHum(a), B = tejasHum(b), n = 0, c = 0, k; for (k in A) { if (A.hasOwnProperty(k)) { n++; if (B[k]) c++; } } return n ? Math.round(100 * c / n) : 0; }
function citasHum(t) { var o = {}, m, re = /\[@([^\]\s;,]+)/g; t = String(t || ''); while ((m = re.exec(t)) !== null) o[m[1]] = 1; return Object.keys(o); }
function origenesHum(clave) {
  var e = S.exp, l = [];
  if (e[clave]) l.push(String(e[clave]));
  if (e['_orig_' + clave]) l.push(String(e['_orig_' + clave]));
  try { (e['_ia_' + clave] ? JSON.parse(e['_ia_' + clave]) : []).forEach(function (p) { if (p && p.t) l.push(p.t); }); } catch (x) { /* sin propuestas */ }
  return l;
}

function revisarHum() {
  var h = S.hum, t = $('#hum-t');
  if (!h || !t) return;
  var txt = t.value, pal = palabrasHum(txt).length;
  var coinc = 0;
  h.origenes.forEach(function (o) { coinc = Math.max(coinc, coincidenciaHum(txt, o)); });
  var faltan = h.citas.filter(function (k) { return citasHum(txt).indexOf(k) < 0; });
  var tecleo = h.propio ? true : h.teclas >= Math.floor(0.3 * txt.length);
  var checks = [
    { ok: pal >= h.min, t: 'Extensi\u00f3n suficiente', d: pal + ' de ' + h.min + ' palabras' },
    { ok: pal >= 8 && coinc <= 25, t: 'Con tus propias palabras', d: pal < 8 ? 'a\u00fan sin texto' : coinc + ' % de frases repetidas (m\u00e1ximo 25 %)' },
    { ok: !faltan.length, t: 'Citas conservadas', d: faltan.length ? 'falta ' + faltan.map(function (k) { return '[@' + k + ']'; }).join(', ') : (h.citas.length ? 'todas presentes' : 'no tiene citas') },
    h.propio ? { ok: pal > 0, t: 'Texto propio declarado', d: 'pegado de tu documento' + (h.pegados ? ' (' + h.pegados + (h.pegados === 1 ? ' vez)' : ' veces)') : '') } : { ok: tecleo && pal > 0, t: 'Escrito a mano', d: h.teclas + ' pulsaciones' + (h.intentos ? ' \u00b7 ' + h.intentos + ' intento(s) de pegar bloqueados' : '') }
  ];
  $('#hum-checks').innerHTML = checks.map(function (c) { return '<li class="' + (c.ok ? 'ok' : '') + '"><span class="hum-ic">' + (c.ok ? IC.check : '') + '</span><span><b>' + c.t + '</b><small>' + esc(c.d) + '</small></span></li>'; }).join('');
  var voz = pal < 8 ? 0 : Math.max(0, 100 - coinc);
  var avance = Math.min(1, pal / Math.max(1, h.min));
  var puntaje = Math.round(voz * avance);
  $('#hum-voz').textContent = puntaje + ' %';
  var b = $('#hum-voz-b');
  b.style.width = puntaje + '%';
  b.className = puntaje >= 75 ? 'verde' : (puntaje >= 40 ? 'ambar' : 'rojo');
  var todo = checks.every(function (c) { return c.ok; });

function guardarHumanizado(btn, modo) {

function confeti() {

/** El siguiente campo por humanizar: primero los que est\u00e1n a la vista en la pantalla actual. */

// ------------------------------------------------------------------ lectura en voz alta y texto propio
function vozDisponible() { return typeof window.speechSynthesis !== 'undefined' && typeof window.SpeechSynthesisUtterance !== 'undefined'; }
/** Lee un texto en voz alta (voz en espa\u00f1ol si el navegador tiene una). Un segundo clic detiene la lectura. */
function leerEnVoz(texto, btn) {
  if (!vozDisponible()) { toast('Tu navegador no tiene lectura en voz alta.'); return; }
  var sy = window.speechSynthesis;
  if (sy.speaking) { sy.cancel(); $$('.hum-voz-btn').forEach(function (b) { b.classList.remove('activo'); }); return; }
  var limpio = String(texto || '').replace(/\[@[^\]]*\]/g, '').replace(/\s+/g, ' ').trim();
  if (!limpio) { toast('A\u00fan no hay texto para leer.'); return; }
  var u = new window.SpeechSynthesisUtterance(limpio);
  u.lang = 'es-PE';
  var voces = sy.getVoices ? sy.getVoices() : [];
  var v = voces.filter(function (x) { return /^es[-_](PE|419|MX|US|CO|AR|CL)/i.test(x.lang); })[0] || voces.filter(function (x) { return /^es/i.test(x.lang); })[0];
  if (v) u.voice = v;

  sy.speak(u);
}

// ------------------------------------------------------------------ leer documentos en el navegador (Word, PDF, texto)
// El archivo no sale del navegador: aqui se convierte en bloques (titulos, parrafos y tablas) y solo se envia
// al servidor lo que el estudiante decide importar.
var NS_W = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main';
var PDFJS_URL = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';

/** Lee un archivo y devuelve { nombre, tipo, bloques: [{t:'h',n,x} | {t:'p',x,li,b} | {t:'tabla',filas}] } */
function leerDocumento(file) {
  var nombre = file.name || 'documento', ext = (nombre.split('.').pop() || '').toLowerCase();
  if (file.size > 25 * 1024 * 1024) return Promise.reject(new Error('El archivo pesa m\u00e1s de 25 MB. Guarda una versi\u00f3n sin im\u00e1genes o pega el texto.'));
  if (ext === 'doc') return Promise.reject(new Error('Es un Word antiguo (.doc). \u00c1brelo en Word y gu\u00e1rdalo como .docx, o copia y pega el texto.'));
  if (ext === 'docx') return file.arrayBuffer().then(leerDocx).then(function (b) { return { nombre: nombre, tipo: 'docx', bloques: b }; });
  if (ext === 'pdf') return file.arrayBuffer().then(leerPdf).then(function (b) { return { nombre: nombre, tipo: 'pdf', bloques: b }; });
  if (['txt', 'md', 'csv', 'bib', 'ris'].indexOf(ext) >= 0 || /^text\//.test(file.type || '')) return file.text().then(function (t) { return { nombre: nombre, tipo: 'texto', bloques: bloquesDeTexto(t) }; });
  return Promise.reject(new Error('Ese tipo de archivo no se puede leer. Usa Word (.docx), PDF o texto (.txt).'));
}

function bloquesDeTexto(t) {
  return String(t || '').replace(/\r/g, '').split('\n').map(function (s) { return s.replace(/\s+/g, ' ').trim(); }).filter(function (s) { return s; }).map(function (s) { return { t: 'p', x: s }; });
}

// ---------------------------------------------------------------- .docx: un zip con XML
function leerZip(buf) {
  var dv = new DataView(buf), u8 = new Uint8Array(buf), i = u8.length - 22;
  while (i >= 0 && dv.getUint32(i, true) !== 0x06054b50) i--;

  var n = dv.getUint16(i + 10, true), cd = dv.getUint32(i + 16, true), out = {}, dec = new TextDecoder();
  for (var k = 0; k < n; k++) {

    var lnom = dv.getUint16(cd + 28, true), lext = dv.getUint16(cd + 30, true), lcom = dv.getUint16(cd + 32, true);
    out[dec.decode(u8.subarray(cd + 46, cd + 46 + lnom))] = { metodo: dv.getUint16(cd + 10, true), comp: dv.getUint32(cd + 20, true), loc: dv.getUint32(cd + 42, true) };
    cd += 46 + lnom + lext + lcom;
  }

}
function extraerZip(buf, ent) {
  var dv = new DataView(buf), l = ent.loc, lnom = dv.getUint16(l + 26, true), lext = dv.getUint16(l + 28, true);
  var datos = new Uint8Array(buf, l + 30 + lnom + lext, ent.comp);
  if (ent.metodo === 0) return Promise.resolve(new TextDecoder().decode(datos));
  if (typeof DecompressionStream === 'undefined') return Promise.reject(new Error('Tu navegador no puede abrir archivos Word. Actual\u00edzalo (Chrome o Edge) o copia y pega el texto.'));
  return new Response(new Blob([datos]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
}
function hijoW(n, nombre) { for (var c = n.firstChild; c; c = c.nextSibling) { if (c.localName === nombre) return c; } return null; }
function valW(n) { return n ? (n.getAttributeNS(NS_W, 'val') || n.getAttribute('w:val') || '') : ''; }

function leerDocx(buf) {

  return Promise.all([extraerZip(buf, z['word/document.xml']), z['word/styles.xml'] ? extraerZip(buf, z['word/styles.xml']) : Promise.resolve('')]).then(function (r) {

        var ppr = hijoW(s, 'pPr'), ol = ppr ? hijoW(ppr, 'outlineLvl') : null;
        estilos[s.getAttributeNS(NS_W, 'styleId') || s.getAttribute('w:styleId')] = { nombre: valW(hijoW(s, 'name')), nivel: ol ? parseInt(valW(ol), 10) + 1 : 0 };
      });
    }
    var doc = new DOMParser().parseFromString(r[0], 'application/xml');
    var body = doc.getElementsByTagNameNS(NS_W, 'body')[0];
    var bloques = [];
    if (body) cuerpoDocx(body, bloques, estilos);
    return bloques;
  });
}
function cuerpoDocx(nodo, bloques, estilos) {
  for (var c = nodo.firstChild; c; c = c.nextSibling) {
    if (c.localName === 'p') { var p = parrafoDocx(c, estilos); if (p) bloques.push(p); }
    else if (c.localName === 'tbl') { var t = tablaDocx(c); if (t) bloques.push(t); }
    else if (c.localName === 'sdt') {
      var pr = hijoW(c, 'sdtPr'), gal = pr ? pr.getElementsByTagNameNS(NS_W, 'docPartGallery')[0] : null;
      if (gal && /contents|contenido/i.test(valW(gal))) continue;   // el indice del Word no se importa

function textoDocx(n) {

function parrafoDocx(p, estilos) {

  var ppr = hijoW(p, 'pPr'), id = ppr ? valW(hijoW(ppr, 'pStyle')) : '', est = estilos[id] || { nombre: id, nivel: 0 };
  if (/^(toc|tdc|tabla de ilustraciones|table of figures)\s*\d*/i.test(est.nombre) || /^(toc|tdc)\d/i.test(id)) return null;
  var ol = ppr ? hijoW(ppr, 'outlineLvl') : null;
  var m = /(?:heading|t[i\u00ed]tulo|encabezado)\s*(\d)/i.exec(est.nombre) || /(?:heading|ttulo|titulo)(\d)/i.exec(id);
  var nivel = m ? parseInt(m[1], 10) : (ol ? parseInt(valW(ol), 10) + 1 : est.nivel);
  if (/^(title|t[i\u00ed]tulo)$/i.test(est.nombre)) nivel = 0;

      for (var p = tc.firstChild; p; p = p.nextSibling) { if (p.localName === 'p') { var t = textoDocx(p).replace(/\s+/g, ' ').trim(); if (t) partes.push(t); } }
      var pr = hijoW(tc, 'tcPr'), span = pr ? parseInt(valW(hijoW(pr, 'gridSpan')), 10) || 1 : 1;

// ---------------------------------------------------------------- .pdf con pdf.js (se carga solo cuando hace falta)
function cargarPdfJs() {
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);

    var s = document.createElement('script');
    s.src = PDFJS_URL + 'pdf.min.js';
    s.onload = function () {
      var L = window.pdfjsLib || window['pdfjs-dist/build/pdf'];

      // El trabajador se crea desde un blob para que funcione dentro de Apps Script
      fetch(PDFJS_URL + 'pdf.worker.min.js').then(function (r) { return r.text(); }).then(function (code) {
        L.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([code], { type: 'text/javascript' }));
        res(L);
      }).catch(function () { L.GlobalWorkerOptions.workerSrc = PDFJS_URL + 'pdf.worker.min.js'; res(L); });
    };
    s.onerror = function () { rej(new Error('No se pudo cargar el lector de PDF. Copia el texto del PDF y p\u00e9galo en el recuadro.')); };
    document.head.appendChild(s);
  });
}
function leerPdf(buf) {
  return cargarPdfJs().then(function (L) { return L.getDocument({ data: new Uint8Array(buf) }).promise; }).then(function (pdf) {
    var paginas = [], n = Math.min(pdf.numPages, 120);
    var cadena = Promise.resolve();
    for (var i = 1; i <= n; i++) {
      (function (k) {
        cadena = cadena.then(function () { return pdf.getPage(k); }).then(function (pg) { return pg.getTextContent(); }).then(function (tc) { paginas.push(lineasPdf(tc.items)); });
      })(i);

    return cadena.then(function () {
      var todas = [].concat.apply([], paginas);
      if (!todas.length) throw new Error('El PDF no tiene texto seleccionable (parece escaneado). Usa el Word original o pega el texto.');
      var tams = todas.map(function (l) { return l.fs; }).sort(function (a, b) { return a - b; }), med = tams[Math.floor(tams.length / 2)] || 12;
      // Se quitan encabezados y pies que se repiten en muchas paginas (numero de pagina, nombre de la universidad)

      todas.forEach(function (l) { var k = l.x.replace(/\d+/g, '#'); cuenta[k] = (cuenta[k] || 0) + 1; });

// ------------------------------------------------------------------ revision por bloques (asesor) y reglamento de similitud
/** Secciones agrupadas por capitulo, en el orden del documento. */
function bloquesRevision() {
  var orden = [], por = {};
  secciones().forEach(function (s) {
    var b = s.bloque || 'Otras secciones';
    if (!por[b]) { por[b] = { nombre: b, secs: [], excluido: !!s.excluida }; orden.push(por[b]); }
    por[b].secs.push(s);
  });
  return orden;
}
function nombreBloque(n) { n = String(n || ''); return n.charAt(0) + n.substring(1).toLowerCase(); }

/** Tarjeta del asesor: aprobar o devolver por capitulos, sin abrir seccion por seccion. */
function bloquesHtml() {
  var bl = bloquesRevision();
  if (!bl.length) return '';
  var decide = puedeDecidir();
  var listasEst = secciones().filter(function (s) { return s.estado === 'revisado' && s.por !== 'asesor'; });
  var h = '<div class="tarjeta bloques-rev"><div class="fila entre"><div><h2 style="margin:0">Revisi\u00f3n por bloques</h2><p class="pequeno tenue" style="margin-top:4px">' + (decide ? 'Aprueba o devuelve un cap\u00edtulo completo con un solo comentario. Si quieres, abre cada secci\u00f3n m\u00e1s abajo.' : 'Avance de la revisi\u00f3n por cap\u00edtulos.') + '</p></div>' +
    (decide && listasEst.length ? '<button class="btn primario" data-a="aprobarRevisadas">' + IC.check + 'Aprobar lo que ya revis\u00f3 (' + listasEst.length + ')</button>' : '') + '</div><div class="bloques-lista">';
  bl.forEach(function (b, i) {
    var n = b.secs.length, rev = b.secs.filter(function (s) { return s.estado === 'revisado'; }).length, apr = b.secs.filter(function (s) { return s.estado === 'revisado' && s.por === 'asesor'; }).length, dev = b.secs.filter(function (s) { return s.estado === 'devuelto'; }).length;
    var todo = apr === n;
    h += '<div class="bloque' + (todo ? ' hecho' : '') + '"><div class="crece"><b>' + esc(nombreBloque(b.nombre)) + '</b><div class="pequeno tenue">' + n + (n > 1 ? ' secciones' : ' secci\u00f3n') + ' \u00b7 ' + rev + ' revisada' + (rev === 1 ? '' : 's') + ' por el estudiante \u00b7 ' + apr + ' aprobada' + (apr === 1 ? '' : 's') + (dev ? ' \u00b7 <span style="color:var(--rojo)">' + dev + ' devuelta' + (dev > 1 ? 's' : '') + '</span>' : '') + '</div>' +
      '<div class="barra-prog verde" style="height:6px;margin-top:6px"><i style="width:' + Math.round(100 * apr / Math.max(1, n)) + '%"></i></div>' +
      (b.excluido ? '<span class="chip borde" style="margin-top:6px" title="Reglamento de Similitud y Originalidad, Art. 8 y 12">Fuera del an\u00e1lisis de similitud</span>' : '') + '</div>' +
      (decide ? '<div class="fila" style="flex:none">' + (todo ? '<span class="chip verde">' + IC.check + 'Aprobado</span>' : '<button class="btn chico" data-a="aprobarBloque" data-i="' + i + '">' + IC.check + 'Aprobar bloque</button>') + '<button class="btn chico fantasma" data-a="devolverBloque" data-i="' + i + '">Devolver</button></div>' : (todo ? '<span class="chip verde">' + IC.check + 'Aprobado</span>' : '')) + '</div>';
  });
  return h + '</div></div>';
}
function pintarBloques() { var n = $('#bloques-rev'); if (n && S.vista === 'alumno') n.innerHTML = bloquesHtml(); }
function revisarBloqueEn(ids, decision, comentario, nombre, btn) {
  var fin = ocupar(btn, decision === 'aprobar' ? 'Aprobando' : 'Devolviendo');
  return llamar('revisarBloque', { correo: S.alumno.perfil.correo, ids: ids, decision: decision, comentario: comentario || '', bloque: nombre }).then(function (v) {
    cerrarModal(); ponerVista(v); pintarBloques(); cargarReglamento();
    toast(decision === 'aprobar' ? ids.length + ' secci\u00f3n(es) aprobadas.' : 'Bloque devuelto al estudiante.', 'bien');
  }).catch(function (e) { fin(); fallo(e); });
}
function aprobarBloque(i, btn) {
  var b = bloquesRevision()[i];
  if (!b) return;
  revisarBloqueEn(b.secs.filter(function (s) { return !(s.estado === 'revisado' && s.por === 'asesor'); }).map(function (s) { return s.id; }), 'aprobar', '', b.nombre, btn);
}
function aprobarRevisadas(btn) {
  var ids = secciones().filter(function (s) { return s.estado === 'revisado' && s.por !== 'asesor'; }).map(function (s) { return s.id; });
  if (ids.length) revisarBloqueEn(ids, 'aprobar', '', 'lo revisado por el estudiante', btn);

function devolverBloque(i) {

    '<textarea id="dev-bloque" rows="4" style="margin-top:10px" placeholder="Qu\u00e9 debe corregir en este cap\u00edtulo"></textarea><div class="fila" style="justify-content:flex-end;margin-top:12px"><button class="btn" data-a="cerrarModal">Cancelar</button><button class="btn peligro" data-a="confirmarDevolverBloque" data-i="' + i + '">Devolver el bloque</button></div>');
}
function confirmarDevolverBloque(i, btn) {
  var b = bloquesRevision()[i];

}

// ------------------------------------------------------------------ Reglamento de Similitud y Originalidad
var REG_IC = { ok: ['verde', 'Cumple'], alerta: ['ambar', 'Revisar'], no_aplica: ['borde', 'Puede no aplicar'] };
function reglamentoHtml(r) {
  var simOk = r.similitud <= r.norma.umbral;
  var h = '<details class="tarjeta reglamento"' + (r.alertas ? ' open' : '') + '><summary><div class="fila entre" style="flex-wrap:nowrap"><div><b>' + IC.rubrica + ' ' + esc(r.norma.nombre) + '</b><div class="pequeno tenue">' + esc(r.norma.norma) + ' \u00b7 tesis de pregrado: hasta ' + r.norma.umbral + ' % de similitud</div></div>' +
    '<span class="chip ' + (r.alertas ? 'ambar' : 'verde') + '">' + (r.alertas ? r.alertas + ' por revisar' : IC.check + 'Cumple') + '</span></div></summary>';
  h += '<div class="reg-medidor"><div class="reg-barra"><i class="' + (simOk ? 'ok' : 'mal') + '" style="width:' + Math.min(100, r.similitud * 2) + '%"></i><em style="left:' + (r.norma.umbral * 2) + '%"><span>M\u00e1x. ' + r.norma.umbral + ' %</span></em></div><div><b>' + r.similitud + ' %</b><span class="pequeno tenue">similitud estimada con el texto generado</span></div></div>';
  h += '<ul class="reg-items">' + r.items.map(function (x) {
    var e = REG_IC[x.estado] || REG_IC.ok;
    return '<li class="' + x.estado + '"><span class="chip ' + e[0] + '">' + (x.estado === 'ok' ? IC.check : (x.estado === 'alerta' ? IC.alerta : '')) + e[1] + '</span><div><b>' + esc(x.t) + '</b> <span class="pequeno tenue">' + esc(x.art) + '</span><div class="pequeno">' + esc(x.d) + '</div></div></li>';
  }).join('') + '</ul>';
  h += '<div class="aviso gris pequeno" style="margin-top:10px"><b>Es posible que estos \u00edtems de tu tesis no apliquen seg\u00fan el reglamento:</b> ' + esc(r.excluidas.join(', ')) + (r.noAplica.length ? ' y lo que va en anexos (' + esc(r.noAplica.join(', ')) + ')' : '') + '. El Art. 12 los excluye del an\u00e1lisis de similitud, igual que las coincidencias de ' + r.norma.palabras + ' palabras o menos y las citas bien referenciadas.</div>' +
    '<p class="pequeno tenue" style="margin-top:8px">Es una estimaci\u00f3n interna frente a los textos que gener\u00f3 la aplicaci\u00f3n; no reemplaza el informe del software institucional de similitud (Art. 14).</p></details>';
  return h;
}
function cargarReglamento() {
  var n = $('#reglamento');
  if (!n) return;
  var p = S.vista === 'alumno' ? llamar('reglamentoDe', { correo: S.alumno.perfil.correo }) : llamar('reglamento');
  p.then(function (r) { var m = $('#reglamento'); if (m) m.innerHTML = reglamentoHtml(r); }).catch(function () { var m = $('#reglamento'); if (m) m.innerHTML = ''; });
}

// ------------------------------------------------------------------ Markdown ligero del borrador (lectura y vista previa)
// La misma sintaxis que entiende el servidor al armar el Word (Informe.gs: leerMd_ y tramosMd_).

/** Bloques de una seccion: h, p, li, cita, tabla, fig, eq. */
function leerMd(texto) {
  var lineas = String(texto || '').replace(/\r\n?/g, '\n').split('\n');
  var out = [], i = 0, tituloTabla = null, m;
  while (i < lineas.length) {
    var t = lineas[i].trim();
    if (!t) { i++; continue; }
    if ((m = /^(#{2,4})\s+(.*)$/.exec(t))) { out.push({ t: 'h', n: m[1].length, x: m[2].trim() }); i++; continue; }
    if (/^\$\$/.test(t)) {
      var eq = t.replace(/^\$\$/, '');
      if (/\$\$$/.test(eq) && eq.length >= 2) { out.push({ t: 'eq', x: eq.replace(/\$\$$/, '').trim() }); i++; continue; }
      i++;
      while (i < lineas.length && !/\$\$\s*$/.test(lineas[i])) { eq += '\n' + lineas[i]; i++; }
      if (i < lineas.length) { eq += '\n' + lineas[i].replace(/\$\$\s*$/, ''); i++; }
      out.push({ t: 'eq', x: eq.trim() });
      continue;
    }
    if ((m = /^Tabla\s*:\s*(.*)$/i.exec(t)) && i + 1 < lineas.length && /^\s*\|/.test(lineas[i + 1])) { tituloTabla = m[1].trim(); i++; continue; }
    if (/^\|/.test(t)) {
      var filas = [];
      while (i < lineas.length && /^\s*\|/.test(lineas[i])) {
        var f = lineas[i].trim().replace(/^\|/, '').replace(/\|$/, '');
        if (!/^\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*$/.test(f)) filas.push(f.split('|').map(function (c) { return c.trim(); }));
        i++;
      }
      var nota = '';
      if (i < lineas.length && /^\s*Nota\s*[:.]/i.test(lineas[i])) { nota = lineas[i].trim().replace(/^Nota\s*[:.]\s*/i, ''); i++; }
      var ancho = 0;
      filas.forEach(function (x) { ancho = Math.max(ancho, x.length); });
      filas = filas.map(function (x) { while (x.length < ancho) x.push(''); return x; });
      if (filas.length) out.push({ t: 'tabla', titulo: tituloTabla || '', filas: filas, nota: nota });
      tituloTabla = null;
      continue;
    }
    if ((m = /^!\[([^\]]*)\]\(([^)]*)\)\s*$/.exec(t))) {
      var id = /^fig:([A-Za-z0-9_\-]{10,})$/.exec(m[2].trim()), fuente = '';
      if (i + 1 < lineas.length && /^\s*Fuente\s*[:.]/i.test(lineas[i + 1])) { fuente = lineas[i + 1].trim().replace(/^Fuente\s*[:.]\s*/i, ''); i++; }
      out.push({ t: 'fig', titulo: m[1].trim(), id: id ? id[1] : '', fuente: fuente });
      i++;
      continue;
    }
    if ((m = /^[-*\u2022]\s+(.*)$/.exec(t))) { out.push({ t: 'li', o: false, x: m[1] }); i++; continue; }
    if ((m = /^(\d+)[.)]\s+(.*)$/.exec(t))) { out.push({ t: 'li', o: true, x: m[2] }); i++; continue; }
    if (/^>\s?/.test(t)) {
      var q = [];
      while (i < lineas.length && /^\s*>/.test(lineas[i])) { q.push(lineas[i].trim().replace(/^>\s?/, '')); i++; }
      out.push({ t: 'cita', x: q.join(' ') });
      continue;
    }
    out.push({ t: 'p', x: t });
    i++;
  }
  return out;
}
function tramosMd(s) {
  var r = [], re = /(\*\*\*([^*]+)\*\*\*|\*\*([^*]+)\*\*|__([^_]+)__|\*([^*\s][^*]*)\*|\$([^$]+)\$)/g, m, ult = 0;
  s = String(s || '');
  while ((m = re.exec(s)) !== null) {
    if (m.index > ult) r.push({ t: s.substring(ult, m.index) });
    if (m[2] !== undefined) r.push({ t: m[2], b: 1, i: 1 });
    else if (m[3] !== undefined) r.push({ t: m[3], b: 1 });
    else if (m[4] !== undefined) r.push({ t: m[4], u: 1 });
    else if (m[5] !== undefined) r.push({ t: m[5], i: 1 });
    else r.push({ t: m[6], m: 1 });
    ult = re.lastIndex;
  }
  if (ult < s.length) r.push({ t: s.substring(ult) });
  return r;
}
function sinMarcasMd(s) { return tramosMd(s).map(function (x) { return x.t; }).join(''); }

var KATEX_URL = 'https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/';

function mdHtml(texto, ctx, o) {

  var h = '', enLista = '';
  function cerrarLista() { if (enLista) { h += '</' + enLista + '>'; enLista = ''; } }
  leerMd(texto).forEach(function (b) {
    if (b.t !== 'li') cerrarLista();
    if (b.t === 'h') {
      var x = sinMarcasMd(b.x), rot, nivel;
      if (o.anexos) { nAnexo++; rot = 'Anexo ' + (nAnexo < 10 ? '0' : '') + nAnexo + ': ' + x; nivel = 2; }
      else if (o.pre) { rot = x; nivel = 2; }

      else if (partes.length === 2 && b.n === 2) { n1++; n2 = 0; rot = o.id + '.' + n1 + ' ' + x; nivel = 3; }
      else { n2++; rot = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.charAt((n2 - 1) % 26) + '. ' + x; nivel = 4; }

      h += b.id ? '<div class="md-fig"><img loading="lazy" src="' + esc(urlFigura(b.id)) + '" alt="' + esc(b.titulo) + '"></div>' : '<div class="md-fig vacia">' + IC.subir + '<span>Espacio para la figura: p\u00e9gala en el Word descargado o s\u00fabela desde el editor.</span></div>';

/** Descarga un contenido como archivo desde el navegador. */
function descargarComoArchivo(nombre, contenido, tipo, base64) {
  var datos = contenido;
  if (base64) { var bin = atob(contenido), arr = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i); datos = arr; }
  var url = URL.createObjectURL(new Blob([datos], { type: tipo }));
  var a = document.createElement('a');
  a.href = url; a.download = nombre; a.rel = 'noopener';
  document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(url); if (a.parentNode) a.parentNode.removeChild(a); }, 4000);
}

function exportarExpediente(btn) {

    try { descargarComoArchivo(r.nombre, r.contenido, 'application/json'); } catch (e) { /* la descarga directa puede estar bloqueada dentro de Google Sites */ }
    var res = $('#exp-res');
    if (res) res.innerHTML = 'Listo: <b>' + esc(r.nombre) + '</b>' + (r.firmado ? ' (firmado).' : '.') + (r.url ? ' Si no se descarg\u00f3, <a href="' + esc(enlace(r.url)) + '" target="_blank" rel="noopener">\u00e1brelo desde aqu\u00ed</a>.' : '');

}

function importarExpediente() {
  var input = $('#archivo-expediente');
  if (!input) return;
  input.value = '';
  input.onchange = function () {
    var f = input.files && input.files[0];
    if (!f) return;
    if (f.size > 40 * 1024 * 1024) { toast('El archivo es demasiado grande.', 'error'); return; }
    var lector = new FileReader();
    lector.onload = function () {
      S.importacion = String(lector.result || '');
      var res = $('#exp-res');
      if (res) res.textContent = 'Revisando el archivo\u2026';
      llamar('importarExpediente', { contenido: S.importacion }).then(function (r) { verResumenImportacion(r.resumen); }).catch(function (e) { if (res) res.textContent = ''; S.importacion = null; fallo(e); });
    };
    lector.readAsText(f);
  };
  input.click();
}
