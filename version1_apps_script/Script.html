      .api(nombre, S.token, args || {});

}

  t.textContent = texto;
  var caja = $('#toasts');
  while (caja.children.length >= 3) caja.removeChild(caja.firstChild);
  caja.appendChild(t);
  setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, tipo === 'error' ? 8000 : 4500);
}

/** Cita del texto, tal como saldra en el documento. En los estilos numericos usa el numero de la ultima pagina armada. */
function citaEnTexto(claves) {
  var e = estiloCita(), nums = [], partes = [], num = (S.vistaDoc && S.vistaDoc.numCitas) || {};
  claves.forEach(function (k) {
    var b = S.d.biblioteca.filter(function (x) { return x.clave_cita === k; })[0];
    if (!b) return;
    if (esNumerico(e)) nums.push(num[k] || '\u2022');
    else partes.push(e === 'chicago' ? citaCorta(b).replace(/, (\S+)$/, ' $1') : citaCorta(b));
  });
  if (nums.length) return e === 'ieee' ? nums.map(function (n) { return '[' + n + ']'; }).join(', ') : '(' + nums.join(',') + ')';
  return partes.length ? '(' + partes.join('; ') + ')' : '';
}
function autoresTexto(b, e) {
  var l = b.autores || [];
  if (!l.length) return 'Autor desconocido';
  if (e === 'ieee') { var x = l.map(function (a) { var i = iniciales(a.nombre); return (i ? i + ' ' : '') + a.apellido; }); return x.length > 6 ? x[0] + ' et al.' : (x.length > 1 ? x.slice(0, x.length - 1).join(', ') + ' y ' + x[x.length - 1] : x[0]); }
  if (e === 'vancouver') { var v = l.map(function (a) { return a.apellido + (a.nombre ? ' ' + iniciales(a.nombre).replace(/[.\s]/g, '') : ''); }); return v.length > 6 ? v.slice(0, 6).join(', ') + ', et al' : v.join(', '); }
  if (e === 'chicago') { var p = l[0].apellido + (l[0].nombre ? ', ' + l[0].nombre : ''); var r = l.slice(1).map(function (a) { return (a.nombre ? a.nombre + ' ' : '') + a.apellido; }); return r.length ? p + (r.length > 1 ? ', ' + r.slice(0, r.length - 1).join(', ') : '') + ' y ' + r[r.length - 1] : p; }
  var a = l.map(function (z) { var i = iniciales(z.nombre); return z.apellido + (i ? ', ' + i : ''); });
  return a.length > 1 ? a.slice(0, a.length - 1).join(', ') + ' y ' + a[a.length - 1] : a[0];
}
/** Referencia en HTML, en el estilo elegido, para las listas de la biblioteca. */
function refHtml(b, estilo) {
  var e = estilo || (S.d ? estiloCita() : 'apa'), anio = esc(b.anio || 's. f.'), t = esc(String(b.titulo || '').replace(/[.\s]+$/, '')), f = esc(b.fuente || ''), ed = esc(b.editorial || b.fuente || '');
  var au = esc(autoresTexto(b, e));
  if (e === 'ieee') {
    if (b.tipo === 'articulo') return au + ', \u00ab' + t + '\u00bb, <i>' + f + '</i>' + (b.volumen ? ', vol. ' + esc(b.volumen) : '') + (b.numero ? ', n.\u00ba ' + esc(b.numero) : '') + (b.paginas ? ', pp. ' + esc(b.paginas) : '') + ', ' + anio + (b.doi ? ', doi: ' + esc(b.doi) : '') + '.';
    if (b.tipo === 'libro') return au + ', <i>' + t + '</i>. ' + (ed ? ed + ', ' : '') + anio + '.';
    return au + ', \u00ab' + t + '\u00bb, ' + (b.tipo === 'tesis' ? esc(b.grado || 'Tesis') + (f ? ', ' + f : '') : f) + ', ' + anio + '.';
  }
  if (e === 'vancouver') {
    if (b.tipo === 'articulo') return au + '. ' + t + '. ' + (f ? f + '. ' : '') + anio + (b.volumen ? ';' + esc(b.volumen) : '') + (b.numero ? '(' + esc(b.numero) + ')' : '') + (b.paginas ? ':' + esc(b.paginas) : '') + '.';
    if (b.tipo === 'tesis') return au + '. ' + t + ' [' + esc(String(b.grado || 'tesis').toLowerCase()) + ']. ' + (f ? f + '; ' : '') + anio + '.';
    return au + '. ' + t + '. ' + (ed ? ed + '; ' : '') + anio + '.';
  }
  if (e === 'chicago') {
    var cab = au.replace(/\.?$/, '.') + ' ' + anio + '. ';
    if (b.tipo === 'articulo') return cab + '\u00ab' + t + '\u00bb. <i>' + f + '</i>' + (b.volumen ? ' ' + esc(b.volumen) : '') + (b.numero ? ' (' + esc(b.numero) + ')' : '') + (b.paginas ? ': ' + esc(b.paginas) : '') + '.';
    if (b.tipo === 'libro') return cab + '<i>' + t + '</i>. ' + (ed ? ed + '.' : '');
    return cab + '\u00ab' + t + '\u00bb. ' + (b.tipo === 'tesis' ? esc(b.grado || 'Tesis') + (f ? ', ' + f : '') : f) + '.';
  }
  var s = au + ' (' + anio + '). ';
  if (b.tipo === 'articulo') s += t + '. <i>' + f + '</i>' + (b.volumen ? ', <i>' + esc(b.volumen) + '</i>' : '') + (b.numero ? '(' + esc(b.numero) + ')' : '') + (b.paginas ? ', ' + esc(b.paginas) : '') + '.';
  else if (b.tipo === 'tesis') s += '<i>' + t + '</i> [' + esc(b.grado || 'Tesis') + (f ? ', ' + f : '') + '].';
  else s += '<i>' + t + '</i>. ' + ed + (ed ? '.' : '');
  return s;
}

// ------------------------------------------------------------------ modos del asistente
// curso: la clave de Gemini del curso. propia: la clave del estudiante, guardada solo en su navegador.
// copiar: la aplicacion arma la consulta y el estudiante trae la respuesta de su propio asistente.
var VIAS = {
  curso: { nombre: 'Asistente del curso', corto: 'Asistente del curso' },
  propia: { nombre: 'Mi propia clave de API' },
  copiar: { nombre: 'Copiar y pegar con mi asistente', corto: 'Copiar y pegar' },
  nano: { nombre: 'Gemini Nano en mi navegador', corto: 'Gemini Nano' }
};
function leerLocal(k) { try { return window.localStorage.getItem(k) || ''; } catch (e) { return ''; } }
function ponerLocal(k, v) { try { if (v) window.localStorage.setItem(k, v); else window.localStorage.removeItem(k); } catch (e) { /* sin almacenamiento */ } }
function modosIA() {
  var c = S.d ? S.d.config : null;
  return String(c && c.MODOS_IA ? c.MODOS_IA : '').split(',').filter(function (m) { return !!VIAS[m]; });
}
function viaUsable(v) {
  if (modosIA().indexOf(v) < 0) return false;
  if (v === 'curso') return S.d.config.IA_ACTIVA === 'SI';
  if (v === 'propia') return !!claveIA();
  if (v === 'nano') return nanoUsable();
  return true;
}
/** Modo en uso: el que eligio el estudiante, o el del curso por defecto, o el primero que se pueda usar. */
function viaIA() {
  if (!S.d) return '';
  var orden = [viaGuardada(), S.d.config.MODO_IA_POR_DEFECTO, 'propia', 'curso', 'nano', 'copiar'];
  for (var i = 0; i < orden.length; i++) { if (orden[i] && viaUsable(orden[i])) return orden[i]; }
  return '';
}
/** Hay al menos un modo que el estudiante puede usar o configurar por su cuenta. */
function iaDisponible() {
  var m = modosIA();
  return m.indexOf('copiar') >= 0 || m.indexOf('propia') >= 0 || (m.indexOf('curso') >= 0 && S.d.config.IA_ACTIVA === 'SI');
}
/** Agrega a los argumentos de una consulta el modo y, si corresponde, la clave del estudiante. */
function conVia(args, via) {
  args.via = via;
  if (via === 'propia') { args.clave = claveIA(); args.proveedor = provIA(); var md = modeloIA(); if (md) args.modelo = md; }
  return args;
}
function attrIA() { return iaDisponible() ? '' : ' disabled title="El asistente a\u00fan no est\u00e1 configurado"'; }

/** Copia un texto al portapapeles. Dentro de Apps Script la API moderna puede estar bloqueada: se intenta primero la seleccion. */
function copiarTexto(texto, area) {
  var ok = false;
  try {
    if (area) { area.focus(); area.select(); try { area.setSelectionRange(0, texto.length); } catch (e1) { /* sin rango */ } ok = document.execCommand('copy'); }
  } catch (e) { ok = false; }
  if (ok) return Promise.resolve(true);
  if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(texto).then(function () { return true; }, function () { return false; });
  return Promise.resolve(false);
}

function guardarToken(t) { S.token = t || ''; try { if (t) sessionStorage.setItem('qsi_token', t); else sessionStorage.removeItem('qsi_token'); } catch (e) { /* sin almacenamiento */ } }
function leerToken() { try { return sessionStorage.getItem('qsi_token') || ''; } catch (e) { return ''; } }

function arrancar() {
  llamar('info').then(function (info) {
    S.info = info;
    document.title = info.app || 'Quiero ser Ingeniero';
    if (!info.instalada) {
      $('#app').innerHTML = '<div class="pagina"><div class="tarjeta" style="max-width:640px;margin:60px auto"><h2>La aplicaci\u00f3n a\u00fan no est\u00e1 instalada</h2><p class="tenue" style="margin-top:8px">Abre el editor de Apps Script, elige la funci\u00f3n <span class="mono">instalar</span> y pulsa \u00abEjecutar\u00bb. Despu\u00e9s vuelve a cargar esta p\u00e1gina.</p></div></div>';
      return;
    }
    var t = leerToken();
    if (!t) { verIngreso('ingresar'); return; }
    S.token = t;
    entrar().catch(function () { guardarToken(''); verIngreso('ingresar'); });
  }).catch(function (e) {
    $('#app').innerHTML = '<div class="pagina"><div class="aviso rojo">No se pudo cargar la aplicaci\u00f3n: ' + esc(e.message) + '</div></div>';
  });
}

function enviarIngreso(form) {
  var fin = ocupar($('button[type=submit]', form), 'Ingresando');
  var clave = $('#i-clave').value;
  llamar('ingresar', { correo: $('#i-correo').value, contrasena: clave }).then(function (r) {
    guardarToken(r.token);
    if (r.perfil.cambiarClave) { verCambioClave(clave); return null; }
    return entrar();
  }).catch(function (e) { fin(); fallo(e); });
}

function enviarRegistro(form) {
  var fin = ocupar($('button[type=submit]', form), 'Creando');
  var propia = $('#r-propia').value;
  llamar('registrar', { nombre: $('#r-nombre').value, correo: $('#r-correo').value, clave: $('#r-clave').value, contrasena: propia }).then(function (r) {

function enviarCambioClave(form) {

/** Carga los datos segun el rol y muestra la primera pantalla. */
function entrar() {
  return llamar('yo', { todo: true }).then(function (yo) {
    S.perfil = { correo: yo.correo, rol: yo.rol, nombre: yo.nombre, cambiarClave: yo.cambiarClave };
    aplicarTema(temaGuardado());
    if (yo.cambiarClave) { verCambioClave(''); return null; }
    if (yo.rol === 'estudiante') {
      var est = yo.estado ? Promise.resolve(yo.estado) : llamar('estado');
      return est.then(function (d) { ponerDatos(d); return ir(d.config.INICIO_ESTUDIANTE === 'modo' ? (modoApp() === 'sencillo' ? 'tesis' : 'ruta') : 'clase'); });
    }
    if (esGlobal()) {
      if (yo.tablero && yo.admin) { ponerTablero(yo.tablero); S.admin = yo.admin; return ir('tablero'); }
      return llamar('tablero').then(function (t) {
        ponerTablero(t);
        return llamar('adminEstado').then(function (a) { S.admin = a; });
      }).then(function () { return ir('tablero'); });
    }
    if (yo.panel) { S.panel = yo.panel; S.panelHora = Date.now(); return ir('panel'); }
    return llamar('panel').then(function (p) { S.panel = p; return ir('panel'); });
  });
}

function ponerDatos(d) {
  S.d = d;
  if (String(d.config.MODOS_IA || '').indexOf('nano') >= 0) detectarNano();
  S.exp = d.expediente;
  S.tablas = {};
}

function salir(porSesion) {
  guardarToken('');
  aplicarTema('indigo');
  S.clase = null; S.imp = null; S.extraer = null; S.inf = null; S.infAlumno = null; S.figLocal = null; S.docModo = '';
  S.d = null; S.perfil = null; S.panel = null; S.admin = null; S.tablero = null; S.alumno = null; S.pend = {}; S.via = ''; S.claveIA = ''; S.copia = null; S.ia = null; S.modo = ''; S.vistaDoc = null;
  cerrarModal();
  verIngreso('ingresar', porSesion === true ? 'Tu sesi\u00f3n termin\u00f3. Vuelve a ingresar.' : '');
}

}

/** Cambia de pantalla. Antes guarda lo pendiente. */

    else if (vista === 'matriz') cuerpo = vistaMatriz();
    else if (vista === 'rubrica') cuerpo = vistaRubrica();

    else if (vista === 'panel') cuerpo = vistaPanel();

    else if (vista === 'admin') cuerpo = vistaAdmin();
    else if (vista === 'tablero') cuerpo = vistaTablero();
    else if (vista === 'guia') cuerpo = vistaGuia();
    else if (vista === 'clase') cuerpo = vistaClase();
    else if (vista === 'borrador') cuerpo = vistaBorrador();

    $('#app').innerHTML = barra() + '<main class="pagina" id="pagina">' + cuerpo + '</main>' + flotante;
    window.scrollTo(0, 0);

    if (vista === 'alumno') despuesDeAlumno();
    if (vista === 'tesis') despuesDeTesis();

    if (vista === 'panel') refrescarPanel();

    if (vista === 'orientacion' && param) { var ancla = document.getElementById('or-' + param); if (ancla) ancla.scrollIntoView({ block: 'start' }); }
  });
}

// ------------------------------------------------------------------ Mi ruta
function siguienteEtapa(d) {
  d = d || S.d;
  for (var i = 0; i < d.etapas.length; i++) {
    var a = d.avance[d.etapas[i].id];
    if (!a || a.estado !== 'aprobada') {
      if (a && a.estado === 'en_revision' && d.config.AVANZAR_EN_REVISION === 'SI' && i < d.etapas.length - 1) continue;
      return d.etapas[i];
    }
  }
  return null;
}

function mapaSvg(d) {
  var n = d.etapas.length;
  var W = 1000, y = 54, x0 = 70, paso = n > 1 ? (W - 2 * x0) / (n - 1) : 0;
  var s = '<svg viewBox="0 0 ' + W + ' 132" role="img" aria-label="Mapa de la ruta de tesis">';
  var i, x;
  for (i = 0; i < n - 1; i++) {
    var hecho = d.avance[d.etapas[i].id] && d.avance[d.etapas[i].id].estado === 'aprobada';
    s += '<line x1="' + (x0 + i * paso + 24) + '" y1="' + y + '" x2="' + (x0 + (i + 1) * paso - 24) + '" y2="' + y + '" stroke="' + (hecho ? '#5B4FE8' : '#D5D4E2') + '" stroke-width="3" stroke-linecap="round"' + (hecho ? '' : ' stroke-dasharray="2 8"') + '/>';
  }
  for (i = 0; i < n; i++) {
    var e = d.etapas[i], st = estadoEtapa(e.id, d);
    x = x0 + i * paso;
    var relleno = '#FFFFFF', borde = '#5B4FE8', tinta = '#4338CA', dentro = '';
    if (st.clave === 'aprobada') { relleno = '#0F7A55'; borde = '#0F7A55'; dentro = '<path d="M' + (x - 8) + ' ' + (y + 1) + 'l5.5 5.5L' + (x + 9) + ' ' + (y - 6) + '" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>'; }
    else if (st.clave === 'en_revision') { relleno = '#EEECFD'; }
    else if (st.clave === 'devuelta' || st.clave === 'observada') { relleno = '#FCE8EA'; borde = '#C22D39'; tinta = '#C22D39'; }
    else if (st.clave === 'en_curso') { relleno = '#FDF1DC'; borde = '#A85A06'; tinta = '#A85A06'; }
    else if (st.clave === 'bloqueada') { relleno = '#EFEFF5'; borde = '#D5D4E2'; tinta = '#8A89A0'; }
    s += '<g data-a="abrirEtapa" data-e="' + esc(e.id) + '" style="cursor:pointer"><title>' + esc(e.nombre + ': ' + st.texto) + '</title>' +
      '<circle cx="' + x + '" cy="' + y + '" r="22" fill="' + relleno + '" stroke="' + borde + '" stroke-width="2.5"/>' +
      (dentro || '<text x="' + x + '" y="' + (y + 5.5) + '" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="15" font-weight="600" fill="' + tinta + '">' + esc(e.id) + '</text>') +
      '<text x="' + x + '" y="' + (y + 46) + '" text-anchor="middle" font-size="14" font-weight="600" fill="#1B1A2E">' + esc(e.nombre) + '</text>' +
      '<text x="' + x + '" y="' + (y + 64) + '" text-anchor="middle" font-size="11.5" fill="#8A89A0">' + esc(st.clave === 'aprobada' ? 'Aprobada' : st.texto) + '</text></g>';
  }
  return s + '</svg>';
}

function anillo(pct) {
  var r = 30, c = 2 * Math.PI * r, p = Math.max(0, Math.min(100, pct));
  return '<svg viewBox="0 0 76 76" role="img" aria-label="' + p + ' por ciento"><circle cx="38" cy="38" r="' + r + '" fill="none" stroke="#EFEFF5" stroke-width="8"/>' +
    (p > 0 ? '<circle cx="38" cy="38" r="' + r + '" fill="none" stroke="#5B4FE8" stroke-width="8" stroke-linecap="round" stroke-dasharray="' + (c * p / 100).toFixed(1) + ' ' + c.toFixed(1) + '" transform="rotate(-90 38 38)"/>' : '') +
    '<text x="38" y="43" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="15" font-weight="600" fill="#1B1A2E">' + Math.round(p) + '%</text></svg>';
}

function conteoBiblioteca(bib) {
  var ant = bib.filter(function (b) { return b.uso === 'antecedente'; });
  return {
    total: bib.length,
    articulos: ant.filter(function (b) { return b.tipo === 'articulo' && b.verificado !== 'no'; }).length,
    tesis: ant.filter(function (b) { return b.tipo === 'tesis'; }).length
  };
}

function filaEtapa(e, d, soloLectura) {
  var st = estadoEtapa(e.id, d);
  var color = st.clave === 'aprobada' ? 'verde' : (st.clave === 'en_revision' ? 'indigo' : (st.clave === 'devuelta' || st.clave === 'observada' ? 'rojo' : (st.clave === 'en_curso' ? 'ambar' : '')));
  var cerrada = st.clave === 'bloqueada';
  return '<div class="etapa-fila' + (cerrada ? ' cerrada' : '') + '"><div class="num ' + color + '">' + esc(e.id) + '</div>' +
    '<div><div class="fila" style="gap:8px"><h3>' + esc(e.nombre) + '</h3>' + chip(st) + (e.requiere_asesor ? '<span class="chip borde" title="Al cerrarla pasa a tu asesor">Visto bueno del asesor</span>' : '') + '</div><div class="prod">' + esc(e.producto) + '</div></div>' +
    '<div class="acc">' + (cerrada ? '<span class="pequeno tenue">Aprueba primero la etapa anterior</span>' : '<button class="btn ' + (st.clave === 'aprobada' ? '' : 'primario') + '" data-a="' + (soloLectura ? 'verEtapaAlumno' : 'abrirEtapa') + '" data-e="' + esc(e.id) + '">' + (st.clave === 'aprobada' || soloLectura ? 'Ver' : (st.clave === 'nueva' ? 'Empezar' : 'Continuar')) + IC.flecha + '</button>') + '</div></div>';
}

  h += '<div class="tarjeta mapa" style="margin-bottom:16px">' + mapaSvg(d) + '</div>';

  h += '<div class="tarjeta"><h3>Tu siguiente paso</h3>' + (sig ? '<p class="tenue" style="margin-bottom:12px">Etapa ' + esc(sig.id) + ': ' + esc(sig.nombre) + '. ' + esc(sig.instruccion) + '</p><button class="btn primario" data-a="abrirEtapa" data-e="' + esc(sig.id) + '">Ir a la etapa' + IC.flecha + '</button>' : '<p class="tenue" style="margin-bottom:12px">Completaste todas las etapas. Genera tu plan de tesis.</p><button class="btn primario" data-a="ir" data-v="plan">Ir a mi plan' + IC.flecha + '</button>') + '</div>';
  h += '<div class="tarjeta"><h3>R\u00fabrica de la UNDC</h3><div class="anillo">' + anillo(rr.porcentaje) + '<div class="pequeno tenue">' + (rr.evaluados ? rr.puntaje + ' de ' + rr.maximo + ' puntos. ' + rr.evaluados + ' de ' + rr.aplicables + ' \u00edtems evaluados.' : 'A\u00fan sin evaluar. Cuando tengas contenido, pide una valoraci\u00f3n por cap\u00edtulo.') + '<br><button class="btn chico" style="margin-top:8px" data-a="ir" data-v="rubrica">Ver r\u00fabrica</button></div></div></div>';

// ------------------------------------------------------------------ Etapa: formulario, guardado y compuerta
function camposEtapa(id) { return S.d.campos.filter(function (c) { return c.etapa === String(id) && aplica(c.aplica); }); }
function tieneCampo(id, clave) { return camposEtapa(id).some(function (c) { return c.clave === clave; }); }

function filasTabla(c) {
  if (!S.tablas[c.clave]) {
    var f = tablaDe(S.exp, c.clave).map(function (x) { var o = {}; c.columnas.forEach(function (col) { o[col.clave] = x[col.clave] === undefined ? '' : String(x[col.clave]); }); return o; });
    var min = Math.max(1, c.min_filas || 0);
    while (f.length < min) f.push(filaVacia(c));
    S.tablas[c.clave] = f;
  }
  return S.tablas[c.clave];
}
function filaVacia(c) { var o = {}; c.columnas.forEach(function (col) { o[col.clave] = ''; }); return o; }
function filasLlenas(c) { return (S.tablas[c.clave] || []).filter(function (f) { return c.columnas.some(function (col) { return String(f[col.clave] || '').trim(); }); }); }

function tablaHtml(c) {
  var filas = filasTabla(c);
  var h = '<div class="tabla-ed' + (c.columnas.length > 3 ? ' ancha' : '') + '"><table><thead><tr><th></th>' + c.columnas.map(function (col) { return '<th>' + esc(col.etiqueta) + '</th>'; }).join('') + '<th></th></tr></thead><tbody>';
  filas.forEach(function (f, i) {
    h += '<tr><td class="n">' + (i + 1) + '</td>' + c.columnas.map(function (col) {
      var at = ' data-campo="' + esc(c.clave) + '" data-i="' + i + '" data-col="' + esc(col.clave) + '" aria-label="' + esc(col.etiqueta + ', fila ' + (i + 1)) + '"';
      if (col.opciones) return '<td><select' + at + '><option value=""></option>' + col.opciones.map(function (o) { return '<option' + (f[col.clave] === o ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join('') + '</select></td>';
      if (col.numero) return '<td style="width:120px"><input type="number" min="0" step="any"' + at + ' value="' + esc(f[col.clave]) + '"></td>';
      return '<td><textarea rows="1"' + at + '>' + esc(f[col.clave]) + '</textarea></td>';
    }).join('') + '<td class="x"><button class="quitar" data-a="quitarFila" data-campo="' + esc(c.clave) + '" data-i="' + i + '" title="Quitar fila" aria-label="Quitar fila ' + (i + 1) + '">' + IC.equis + '</button></td></tr>';
  });
  return h + '</tbody></table></div>';

function controlHtml(c) {
  var v = S.exp[c.clave] || '';
  if (c.tipo === 'tabla') return '<div id="t-' + esc(c.clave) + '">' + tablaHtml(c) + '</div>';
  if (c.tipo === 'opcion') {
    if (c.opciones.length > 6) {
      return '<select id="f-' + esc(c.clave) + '" data-campo="' + esc(c.clave) + '"><option value="">Elige una opci\u00f3n</option>' + c.opciones.map(function (o) { return '<option value="' + esc(o.valor) + '"' + (v === o.valor ? ' selected' : '') + '>' + esc(o.texto) + '</option>'; }).join('') + '</select>';
    }
    var largo = c.opciones.some(function (o) { return o.texto.length > 26; });
    return '<div class="opciones' + (largo ? '' : ' linea') + '" role="radiogroup" aria-label="' + esc(etiquetaDe(c)) + '">' + c.opciones.map(function (o) {
      return '<label class="opcion' + (v === o.valor ? ' elegida' : '') + '"><input type="radio" name="f-' + esc(c.clave) + '" data-campo="' + esc(c.clave) + '" value="' + esc(o.valor) + '"' + (v === o.valor ? ' checked' : '') + '><span>' + esc(o.texto) + '</span></label>';
    }).join('') + '</div>';
  }
  if (c.tipo === 'parrafo') return '<textarea id="f-' + esc(c.clave) + '" data-campo="' + esc(c.clave) + '" rows="3">' + esc(v) + '</textarea>';
  return '<textarea id="f-' + esc(c.clave) + '" data-campo="' + esc(c.clave) + '" rows="1" data-una="1">' + esc(v) + '</textarea>';

function campoHtml(c) {

    var r = S.d.rubrica.filter(function (x) { return x.item === n; })[0];
    if (!r || !itemAplica(r)) return '';
    return '<button class="chip borde" data-a="verItem" data-n="' + n + '" title="' + esc(r.criterio) + '" style="cursor:pointer">R\u00fabrica ' + n + '</button>';
  }).join(' ');
  var acc = '<button class="btn chico" data-a="ia" data-modo="ayuda" data-campo="' + esc(c.clave) + '"' + no + '>Expl\u00edcame</button>';

}

function vistaEtapa() {
  var d = S.d, e = etapaDe(S.etapa);
  if (!e || !accesible(S.etapa)) return '<div class="vacio">Esta etapa a\u00fan est\u00e1 bloqueada. <button class="btn" data-a="ir" data-v="ruta">Volver a mi ruta</button></div>';
  var st = estadoEtapa(e.id), cs = camposEtapa(e.id);
  var ancla = { '0': 'empezar', '1': 'empezar', '2': 'p1', '3': 'p2', '4': 'p3', '5': 'p4', '6': 'cadena' }[e.id] || 'empezar';
  var h = '<div class="cabecera"><div class="miga"><button data-a="ir" data-v="ruta">Mi ruta</button> / Etapa ' + esc(e.id) + '</div><div class="fila"><h1>' + esc(e.nombre) + '</h1><span id="chip-etapa">' + chip(st) + '</span></div><p>' + esc(e.instruccion) + ' <button class="enlace" data-a="ir" data-v="orientacion" data-p="' + ancla + '">Ver la orientaci\u00f3n de esta etapa</button></p></div>';
  h += '<div class="rejilla dos"><div class="pila" id="formulario">';
  h += '<div id="aviso-etapa">' + avisoEtapa() + '</div>';
  if (tieneCampo(e.id, 'brujula_resultado') && enlace(d.config.BRUJULA_URL)) {
    h += '<div class="tarjeta plana" id="tarjeta-brujula"><div class="fila entre"><div style="max-width:62ch"><h3>\u00bfA\u00fan no tienes tema?</h3><p class="tenue pequeno">Empieza por la Br\u00fajula de Tesis: en pocos minutos te ubica en un \u00e1rea, una l\u00ednea y subl\u00edneas posibles. Cuando termines, pega su recomendaci\u00f3n en el primer campo y \u00fasala para escribir tu tema.</p></div><a class="btn primario" href="' + esc(enlace(d.config.BRUJULA_URL)) + '" target="_blank" rel="noopener">' + IC.brujula + 'Abrir la Br\u00fajula de Tesis</a></div></div>';
  }
  if (tieneCampo(e.id, 'brechas')) {
    var cb = conteoBiblioteca(d.biblioteca);
    h += '<div class="tarjeta plana"><div class="fila entre"><div><h3>Tu biblioteca</h3><p class="tenue pequeno">Los antecedentes no se escriben aqu\u00ed: se registran en la biblioteca con su ficha y el plan los redacta. Art\u00edculos: <b>' + cb.articulos + ' de ' + esc(d.config.MIN_ARTICULOS) + '</b>. Tesis: <b>' + cb.tesis + ' de ' + esc(d.config.MIN_TESIS) + '</b>.</p></div><button class="btn" data-a="ir" data-v="biblioteca">' + IC.libro + 'Abrir biblioteca</button></div></div>';
  }
  h += cs.map(campoHtml).join('');
  if (tieneCampo(e.id, 'problema_central')) h += '<div class="tarjeta plana"><h3>\u00c1rbol de problemas</h3><p class="tenue pequeno" style="margin-bottom:10px">Se dibuja con lo que escribes arriba y se incluye en los anexos de tu plan.</p><div class="figura" id="arbol"></div></div>';
  if (tieneCampo(e.id, 'titulo')) h += '<div class="tarjeta plana"><div class="fila entre"><div><h3>Matriz de consistencia</h3><p class="tenue pequeno">Se arma sola con tus problemas, objetivos, hip\u00f3tesis y variables. M\u00edrala antes de cerrar la etapa.</p></div><button class="btn" data-a="ir" data-v="matriz">Ver matriz' + IC.flecha + '</button></div></div>';
  if (tieneCampo(e.id, 'cronograma')) h += '<div class="tarjeta plana"><div class="fila entre"><div><h3>Plan de tesis</h3><p class="tenue pequeno">Puedes generar un borrador en cualquier momento. Lo que falte aparecer\u00e1 resaltado.</p></div><button class="btn" data-a="ir" data-v="plan">' + IC.doc + 'Ir a mi plan</button></div></div>';
  h += '<div class="compuerta" id="compuerta"></div><div id="comentarios-etapa"></div></div>';
  h += asistenteHtml() + '</div><button class="btn primario boton-ia-movil" data-a="abrirAsistente">' + IC.chispa + 'Asistente</button>';
  return h;
}

function avisoEtapa() {
  var a = S.d.avance[S.etapa];
  if (!a) return '';
  if (a.estado === 'aprobada' || a.estado === 'en_revision') return '<div class="aviso gris">Esta etapa ya est\u00e1 cerrada. Si cambias un campo, se reabrir\u00e1 junto con las etapas siguientes y tendr\u00e1s que cerrarlas otra vez.</div>';
  if (a.estado === 'devuelta') return '<div class="aviso rojo">Tu asesor devolvi\u00f3 esta etapa. Lee su comentario al final, corrige y vuelve a cerrarla.</div>';
  return '';
}

/** Lo que se pinta despues de insertar el HTML de la etapa. */
function despuesDeEtapa() {
  if (!etapaDe(S.etapa) || !accesible(S.etapa)) return;
  camposEtapa(S.etapa).forEach(pintarCuenta);
  pintarObservaciones();
  pintarCompuerta();
  pintarComentarios();
  pintarArbol();
  pintarAsistente();
}

function pintarCuenta(c) {
  var el = $('#n-' + c.clave);
  if (!el) return;
  if (c.tipo === 'parrafo') el.textContent = palabras(S.exp[c.clave]) + ' palabras';
  else if (c.clave === 'titulo') el.textContent = palabras(S.exp[c.clave]) + ' de 20 palabras';
  else if (c.tipo === 'tabla') el.textContent = filasLlenas(c).length + ' fila(s)' + (c.min_filas ? ' \u00b7 m\u00ednimo ' + c.min_filas : '');
  else el.textContent = '';
}

function pintarObservaciones() {
  var a = S.d.avance[S.etapa];
  var obs = a && a.detalle && a.detalle.observaciones ? a.detalle.observaciones : [];
  camposEtapa(S.etapa).forEach(function (c) {
    var el = $('#o-' + c.clave);
    if (!el) return;
    el.innerHTML = obs.filter(function (o) { return o.campo === c.clave; }).map(function (o) {
      return '<div class="obs ' + (o.nivel === 'bloqueante' ? 'bloqueante' : '') + '"><b>' + (o.nivel === 'bloqueante' ? 'Bloqueante' : 'Por mejorar') + (o.origen === 'ia' ? ' (asistente)' : '') + ':</b> ' + esc(o.texto) + '</div>';
    }).join('');
  });
}

// ------------------------------------------------------------------ edicion y guardado
function alEscribir(el) {
  var clave = el.getAttribute('data-campo');
  var c = campoDe(clave);
  if (!c) return;
  if (c.tipo === 'tabla') {
    var i = parseInt(el.getAttribute('data-i'), 10), col = el.getAttribute('data-col');
    var filas = filasTabla(c);
    if (!filas[i]) return;
    filas[i][col] = el.value;
    sincronizarTabla(c);
    crecer(el);
  } else {
    if (el.getAttribute('data-una')) { var limpio = el.value.replace(/\n/g, ' '); if (limpio !== el.value) el.value = limpio; }
    S.exp[clave] = el.value;
    programar(clave, el.value);
    crecer(el);
    if (c.tipo === 'opcion' && el.type === 'radio') $$('#c-' + clave + ' .opcion').forEach(function (o) { o.classList.toggle('elegida', $('input', o).checked); });
  }
  pintarCuenta(c);
  var ob = $('#o-' + clave);
  if (ob && ob.innerHTML) ob.innerHTML = '';
  if (clave === 'problema_central' || clave === 'causas' || clave === 'efectos' || clave === 'efecto_final') pintarArbolLuego();
  if (S.vista === 'tesis') {
    ecoVista(clave);
    pintarProgreso();
    // Estas dos respuestas cambian que preguntas y que secciones aplican
    if (clave === 'tipo_proyecto' || clave === 'con_hipotesis') repintarFormTesis();
  }
}
function sincronizarTabla(c) {
  var llenas = filasLlenas(c);
  S.exp[c.clave] = llenas.length ? JSON.stringify(llenas) : '';
  programar(c.clave, llenas.length ? llenas : '');
}
function programar(clave, valor) {
  S.pend[clave] = valor;
  S.vistaSucia = true;
  pintarGuardado('pendiente');
  if (S.reloj) clearTimeout(S.reloj);
  S.reloj = setTimeout(function () { S.reloj = null; guardarAhora().catch(function () {}); }, 1400);
}
function pintarGuardado(estado) {
  var el = $('#guardado');
  if (!el) return;
  el.className = 'guardado' + (estado === 'error' ? ' mal' : '');
  el.textContent = estado === 'pendiente' ? 'Sin guardar' : (estado === 'guardando' ? 'Guardando' : (estado === 'error' ? 'No se guard\u00f3' : (estado === 'ok' ? 'Guardado' : '')));
}
function guardarAhora() {
  if (S.reloj) { clearTimeout(S.reloj); S.reloj = null; }
  if (S.guardando) return S.guardando.then(guardarAhora, guardarAhora);
  var claves = Object.keys(S.pend);
  if (!claves.length || !S.token || !S.d) return Promise.resolve();
  var envio = S.pend;
  S.pend = {};
  pintarGuardado('guardando');
  var conVista = S.vista === 'tesis';
  S.guardando = llamar('guardar', conVista ? { valores: envio, vista: true } : { valores: envio }).then(function (r) {
    S.guardando = null;
    S.d.avance = r.avance;
    if (r.bloqueados && r.bloqueados.length) { toast('Tu plan est\u00e1 aprobado: esos cambios no se guardaron. Pide un cambio desde \u00abBorrador\u00bb.', 'error'); }
    if (r.vista && S.vista === 'tesis') ponerVista(r.vista);
    if (r.reabiertas.length) {
      toast('Cambiaste una etapa que ya estaba cerrada. Se reabri\u00f3 ' + (r.reabiertas.length > 1 ? 'junto con las siguientes (' + r.reabiertas.join(', ') + ')' : 'la etapa ' + r.reabiertas[0]) + ': tendr\u00e1s que cerrarla de nuevo.');
      if (S.vista === 'etapa') { var ch = $('#chip-etapa'); if (ch) ch.innerHTML = chip(estadoEtapa(S.etapa)); var av = $('#aviso-etapa'); if (av) av.innerHTML = avisoEtapa(); pintarCompuerta(); }
    }
    claves.forEach(function (k) {
      var p = S.propuestas[k];
      if (p && typeof envio[k] === 'string' && envio[k].trim() !== p.texto.trim()) { delete S.propuestas[k]; llamar('marcarIA', { id: p.id, estado: 'editado' }).catch(function () {}); }
    });
    pintarGuardado(Object.keys(S.pend).length ? 'pendiente' : 'ok');
  }, function (e) {
    S.guardando = null;
    for (var k in envio) { if (envio.hasOwnProperty(k) && !S.pend.hasOwnProperty(k)) S.pend[k] = envio[k]; }
    pintarGuardado('error');
    throw e;
  });
  return S.guardando;
}

function agregarFila(clave) {
  var c = campoDe(clave);
  filasTabla(c).push(filaVacia(c));
  repintarTabla(c, true);
}
function quitarFila(clave, i) {
  var c = campoDe(clave), f = filasTabla(c);
  f.splice(i, 1);
  if (!f.length) f.push(filaVacia(c));
  sincronizarTabla(c);
  repintarTabla(c, false);
  if (clave === 'causas' || clave === 'efectos') pintarArbol();
}
function repintarTabla(c, enfocarUltima) {
  var cont = $('#t-' + c.clave);
  if (!cont) return;
  cont.innerHTML = tablaHtml(c);
  crecerTodos(cont);
  pintarCuenta(c);
  if (enfocarUltima) { var ult = $$('tbody tr', cont).pop(); var prim = ult ? $('textarea, input, select', ult) : null; if (prim) prim.focus(); }
}
/** Pone un valor en un campo de texto de la etapa abierta y lo guarda. */
function ponerValor(clave, valor) {
  S.exp[clave] = valor;
  var el = $('#f-' + clave);
  if (el) { el.value = valor; crecer(el); }
  var c = campoDe(clave);
  if (c) pintarCuenta(c);
  programar(clave, valor);
  if (S.vista === 'tesis') { ecoVista(clave); pintarProgreso(); }
}

// ------------------------------------------------------------------ compuerta
function pintarCompuerta() {
  var cont = $('#compuerta');
  if (!cont) return;
  var e = etapaDe(S.etapa), a = S.d.avance[S.etapa], det = a && a.detalle ? a.detalle : null;
  var obs = det && det.observaciones ? det.observaciones : [];
  var h = '', via0 = viaIA();
  if (a && det && det.fecha) {
    var color = a.estado === 'en_revision' ? 'indigo' : (a.semaforo || 'ambar');
    var titulo = a.estado === 'aprobada' ? (a.semaforo === 'ambar' ? 'Etapa aprobada, con puntos por mejorar' : 'Etapa aprobada') : (a.estado === 'en_revision' ? (det.excepcion ? 'Tu asesor decidir\u00e1 sobre la observaci\u00f3n' : 'Enviada a tu asesor') : (a.estado === 'devuelta' ? 'Tu asesor devolvi\u00f3 la etapa' : (a.semaforo === 'rojo' ? 'A\u00fan no: hay observaciones que corregir' : 'Etapa reabierta: vuelve a cerrarla')));
    if (a.estado === 'devuelta') color = 'rojo';
    if (a.estado === 'en_curso' && a.semaforo !== 'rojo') color = 'ambar';
    h += '<div class="semaforo ' + color + '"><span class="luz">' + (color === 'verde' ? IC.check : (color === 'indigo' ? IC.reloj : IC.alerta)) + '</span><div><h2>' + titulo + '</h2><div class="pequeno tenue">\u00daltima revisi\u00f3n: ' + esc(fechaCorta(det.fecha)) + ' \u00b7 ' + comoSeReviso(det, false) + '</div></div></div>';
    if (det.resumen) h += '<p class="tenue">' + esc(det.resumen) + '</p>';
    if (a.estado === 'en_revision' && S.d.config.AVANZAR_EN_REVISION === 'SI') h += '<p class="tenue pequeno" style="margin-top:6px">Mientras tu asesor revisa, puedes avanzar con la etapa siguiente.</p>';
    if (obs.length) {
      h += '<div class="obs-lista">' + obs.map(function (o) {
        var c = o.campo ? campoDe(o.campo) : null;
        return '<div class="obs-item"><span class="chip ' + (o.nivel === 'bloqueante' ? 'rojo' : 'ambar') + '">' + (o.nivel === 'bloqueante' ? 'Bloqueante' : 'Por mejorar') + '</span><div>' + esc(o.texto) + '<div class="pequeno tenue">' + (o.origen === 'ia' ? 'Asistente' : 'Regla autom\u00e1tica') + (o.item ? ' \u00b7 r\u00fabrica, \u00edtem ' + o.item : '') + (c ? ' \u00b7 ' + esc(etiquetaDe(c)) : '') + '</div></div>' +
          (c && c.etapa === S.etapa ? '<button class="btn chico" data-a="irCampo" data-campo="' + esc(o.campo) + '">Ir al campo</button>' : '<span></span>') + '</div>';
      }).join('') + '</div>';
    }
  } else {
    var medio = viaLocal(via0) ? 'recibes la consulta de revisi\u00f3n para pegarla en tu asistente y traer su respuesta' : (via0 ? 'el asistente revisa la coherencia con la r\u00fabrica' : 'la revisi\u00f3n queda en las reglas, porque a\u00fan no hay un asistente configurado,');
    h += '<h2>Cerrar la etapa</h2><p class="tenue" style="margin:6px 0 12px">Al cerrar pasan tres cosas: se aplican las reglas autom\u00e1ticas, ' + medio + (e.requiere_asesor ? ' y, si todo est\u00e1 bien, la etapa pasa a tu asesor para su visto bueno.' : ' y, si todo est\u00e1 bien, se abre la etapa siguiente.') + '</p>';
  }
  if (iaDisponible()) h += '<p class="pequeno tenue" id="via-cierre">La revisi\u00f3n se har\u00e1 con: <b>' + (via0 ? esc(VIAS[via0].corto) : 'sin asistente') + '</b>' + (modosIA().length > 1 || !via0 ? ' \u00b7 <button class="enlace" data-a="modoIA">cambiar</button>' : '') + '</p>';
  var bloqueaRegla = obs.some(function (o) { return o.nivel === 'bloqueante' && o.origen === 'regla'; });
  var bloqueaIA = obs.some(function (o) { return o.nivel === 'bloqueante' && o.origen === 'ia'; });
  var cerrada = a && (a.estado === 'aprobada' || a.estado === 'en_revision');
  h += '<div class="fila" style="margin-top:12px"><button class="btn ' + (cerrada ? '' : 'primario') + '" data-a="cerrarEtapa">' + (a && det && det.fecha ? 'Revisar y cerrar de nuevo' : 'Cerrar etapa') + '</button>';
  if (a && a.semaforo === 'rojo' && a.estado === 'en_curso' && bloqueaIA && !bloqueaRegla) h += '<button class="btn" data-a="excepcion">No estoy de acuerdo: que decida mi asesor</button>';
  if (cerrada) { var sig = siguienteDe(S.etapa); h += sig ? '<button class="btn primario" data-a="abrirEtapa" data-e="' + esc(sig.id) + '">Siguiente: ' + esc(sig.nombre) + IC.flecha + '</button>' : '<button class="btn primario" data-a="ir" data-v="plan">Ir a mi plan' + IC.flecha + '</button>'; }
  h += '</div>';
  cont.innerHTML = h;
}
function siguienteDe(id) {
  var et = S.d.etapas;
  for (var i = 0; i < et.length - 1; i++) { if (et[i].id === String(id)) return accesible(et[i + 1].id) ? et[i + 1] : null; }
  return null;
}
function pintarComentarios() {
  var cont = $('#comentarios-etapa');
  if (!cont) return;
  var l = S.d.comentarios.filter(function (c) { return String(c.etapa) === S.etapa; });
  cont.innerHTML = l.length ? '<div class="tarjeta plana"><h3>Comentarios de esta etapa</h3><div class="pila" style="gap:10px">' + l.map(function (c) {
    return '<div class="comentario"><div class="meta">' + esc(c.autor) + (c.rol === 'estudiante' ? ' (t\u00fa)' : '') + ' \u00b7 ' + esc(fechaCorta(c.fecha)) + '</div>' + (c.decision ? '<b>' + (c.decision === 'aprobada' ? 'Aprob\u00f3 la etapa. ' : 'Devolvi\u00f3 la etapa. ') + '</b>' : '') + esc(c.texto) + '</div>';
  }).join('') + '</div></div>' : '';
}

/** Con qu\u00e9 se hizo la \u00faltima revisi\u00f3n de una etapa. lector: quien lee es el asesor. */
function comoSeReviso(det, lector) {
  if (det.ia === 'si') return 'reglas y asistente';
  if (det.ia === 'pegada') return lector ? 'reglas y revisi\u00f3n pegada por el estudiante (no verificada)' : 'reglas y revisi\u00f3n de tu propio asistente (no verificada)';
  if (det.ia === 'error') return 'reglas; la revisi\u00f3n del asistente fall\u00f3';
  return 'solo reglas autom\u00e1ticas';
}

function cerrarEtapa(btn) {
  var via = viaIA();
  if (!via) {
    // Sin ningun modo utilizable: si el curso es una opcion, la etapa se cierra solo con reglas
    if (modosIA().indexOf('curso') >= 0) via = 'curso';
    else { abrirModoIA(); toast('Elige primero c\u00f3mo usar\u00e1s el asistente.'); return; }
  }
  var fin = ocupar(btn, 'Revisando la etapa');
  var etapa = S.etapa, e0 = etapaDe(etapa);
  var args = conVia({ etapa: etapa }, via);
  guardarAhora().then(function () {
    return viaLocal(via) ? porCopia('cerrarEtapa', args, 'Revisi\u00f3n de la etapa ' + e0.id + ': ' + e0.nombre) : llamar('cerrarEtapa', args);
  }).then(function (r) {
    fin();
    S.d.avance[etapa] = { estado: r.estado, semaforo: r.semaforo, detalle: r.detalle, actualizado: r.detalle.fecha };
    if (r.detalle.ia === 'si' && via === 'curso') S.d.uso++;
    if (S.vista !== 'etapa' || S.etapa !== etapa) return;
    $('#chip-etapa').innerHTML = chip(estadoEtapa(etapa));
    $('#aviso-etapa').innerHTML = avisoEtapa();
    pintarObservaciones();
    pintarCompuerta();
    pintarAsistente();
    $('#compuerta').scrollIntoView({ behavior: 'smooth', block: 'center' });
    if (r.estado === 'aprobada') toast('Etapa aprobada.', 'bien');
    else if (r.estado === 'en_revision') toast('Etapa enviada a tu asesor.', 'bien');
    else toast('La etapa tiene observaciones por corregir.');
  }).catch(function (e) { fin(); if (e && e.cancelado) return; fallo(e); });
}

function abrirExcepcion() {
  modal('<h2>Pedir que decida tu asesor</h2><p class="tenue" style="margin-bottom:12px">Explica por qu\u00e9 no est\u00e1s de acuerdo con la observaci\u00f3n del asistente. Tu asesor la leer\u00e1 y aprobar\u00e1 o devolver\u00e1 la etapa.</p><textarea id="motivo" rows="4" placeholder="Mi argumento es\u2026"></textarea><div class="fila" style="justify-content:flex-end;margin-top:14px"><button class="btn" data-a="cerrarModal">Cancelar</button><button class="btn primario" data-a="enviarExcepcion">Enviar a mi asesor</button></div>');
}
function enviarExcepcion(btn) {
  var fin = ocupar(btn, 'Enviando');
  var etapa = S.etapa, motivo = $('#motivo').value;
  llamar('excepcion', { etapa: etapa, motivo: motivo }).then(function () { return llamar('estado'); }).then(function (d) {
    ponerDatos(d);
    cerrarModal();
    toast('Tu asesor decidir\u00e1 sobre la observaci\u00f3n.', 'bien');
    ir('etapa', etapa);
  }).catch(function (e) { fin(); fallo(e); });
}

function irCampo(clave) {
  var s = $('#c-' + clave);
  if (!s) return;
  s.scrollIntoView({ behavior: 'smooth', block: 'center' });
  s.classList.add('marcado');
  setTimeout(function () { s.classList.remove('marcado'); }, 2200);
  var f = $('textarea, input, select', s);
  if (f) f.focus({ preventScroll: true });
}

// ------------------------------------------------------------------ arbol de problemas (SVG)
function partirTexto(t, max, lineasMax) {
  var pal = String(t || '').replace(/\[@[^\]]+\]/g, '').replace(/\[por completar[^\]]*\]/g, '').replace(/\s+/g, ' ').trim().split(' ');
  var lineas = [], act = '';
  pal.forEach(function (p) {
    if ((act + ' ' + p).trim().length > max && act) { lineas.push(act); act = p; } else { act = (act + ' ' + p).trim(); }
  });
  if (act) lineas.push(act);
  if (lineas.length > lineasMax) { lineas = lineas.slice(0, lineasMax); lineas[lineasMax - 1] = lineas[lineasMax - 1].replace(/.{0,3}$/, '') + '\u2026'; }
  return lineas;
}
function arbolSvg(exp) {
  var causas = tablaDe(exp, 'causas').map(function (f) { return f.causa; }).filter(function (x) { return String(x || '').trim(); }).slice(0, 6);
  var efectos = tablaDe(exp, 'efectos').map(function (f) { return f.efecto; }).filter(function (x) { return String(x || '').trim(); }).slice(0, 6);
  var central = String(exp.problema_central || '').trim(), final = String(exp.efecto_final || '').trim();
  if (!central && !causas.length && !efectos.length) return { svg: '', ancho: 0, alto: 0 };

// ------------------------------------------------------------------ copiar y pegar
function clonar(o) { var r = {}; for (var k in o) { if (o.hasOwnProperty(k)) r[k] = o[k]; } return r; }

/**
 * Lleva una consulta por el modo de copiar y pegar. ruta: 'iaRespuesta' (ayudas, rubrica, ficha) o 'cerrarEtapa'.
 * Devuelve una promesa con el mismo resultado que daria el asistente del curso. Si el estudiante cancela, rechaza con { cancelado: true }.
 */
function porCopia(ruta, args, titulo) {
  return new Promise(function (resolver, rechazar) {
    if (S.copia) { rechazar({ cancelado: true }); return; }   // ya hay una consulta en curso
    // S.copia se marca antes de llamar: mientras exista, la ventana no se cierra con Escape ni con un clic afuera
    var c = S.copia = { ruta: ruta, args: args, consulta: '', titulo: titulo, resolver: resolver, rechazar: rechazar, ocupada: true };
    modal('<div class="pensando" style="padding:18px 4px"><i></i><span>Armando la consulta con tu avance\u2026</span></div>', true);
    (ruta === 'cerrarEtapa' ? llamar('cerrarEtapa', args) : llamar('iaConsulta', args)).then(function (r) {
      if (S.copia !== c) return;
      // Al cerrar una etapa, si las reglas automaticas bloquean no hay nada que consultar
      if (ruta === 'cerrarEtapa' && r.fase !== 'consulta') { S.copia = null; cerrarModal(); resolver(r); return; }
      c.consulta = r.consulta;
      c.ocupada = false;
      if (args.via === 'nano') { resolverConNano(c); return; }
      pintarCopia();
    }).catch(function (e) { if (S.copia === c) { S.copia = null; cerrarModal(); } rechazar(e); });
  });
}

/** Comprueba una vez si Gemini Nano se puede usar dentro de la aplicacion o en la pagina auxiliar. */
function detectarNano() {
  if (S.nano && S.nano.estado !== 'buscando') return Promise.resolve(S.nano);
  S.nano = { estado: 'buscando' };
  var auxiliar = function () { S.nano = { estado: S.d && S.d.config.NANO_URL ? 'auxiliar' : 'no' }; return S.nano; };
  try {
    if (typeof window.LanguageModel === 'undefined' || !window.LanguageModel.availability) return Promise.resolve(auxiliar());
    return window.LanguageModel.availability({ expectedInputs: [{ type: 'text', languages: ['es'] }], expectedOutputs: [{ type: 'text', languages: ['es'] }] }).then(function (a) {
      if (a === 'available') S.nano = { estado: 'si' };
      else if (a === 'downloadable' || a === 'downloading') S.nano = { estado: 'descargable' };
      else return auxiliar();
      return S.nano;
    }).catch(function () { return auxiliar(); });
  } catch (e) { return Promise.resolve(auxiliar()); }
}
function nanoUsable() { return !!S.nano && ['si', 'descargable', 'auxiliar'].indexOf(S.nano.estado) >= 0; }
/** Copiar y pegar y Gemini Nano llevan la consulta al navegador y traen la respuesta. */
function viaLocal(v) { return v === 'copiar' || v === 'nano'; }

/** Pregunta a Gemini Nano dentro de la pagina. Rechaza con { largo: true } si la consulta no cabe. */
function nanoEnPagina(texto) {
  var opciones = { expectedInputs: [{ type: 'text', languages: ['es'] }], expectedOutputs: [{ type: 'text', languages: ['es'] }] };
  return window.LanguageModel.create(opciones).then(function (s) {
    var medir = s.measureInputUsage ? s.measureInputUsage(texto) : Promise.resolve(0);
    return medir.then(function (n) {
      if (s.inputQuota && n > s.inputQuota) { if (s.destroy) s.destroy(); throw { largo: true }; }
      return s.prompt(texto).then(function (r) { if (s.destroy) s.destroy(); return r; });
    });
  });
}

/** Pregunta a Gemini Nano en la pagina auxiliar (otra pestana) y espera su respuesta por mensaje. */
function nanoAuxiliar(texto) {
  return new Promise(function (resolver, rechazar) {
    var url = S.d.config.NANO_URL, origen = '';
    try { origen = new URL(url).origin; } catch (e) { rechazar(new Error('La direcci\u00f3n de la p\u00e1gina auxiliar no es v\u00e1lida.')); return; }
    var id = 'q' + Date.now(), w = window.open(url, 'qsi_nano');
    if (!w) { rechazar(new Error('El navegador bloque\u00f3 la pesta\u00f1a auxiliar. Permite las ventanas emergentes para esta p\u00e1gina.')); return; }
    var listo = false, plazo = setTimeout(function () { fin(); rechazar(new Error('La pesta\u00f1a auxiliar no respondi\u00f3 a tiempo.')); }, 240000);
    function fin() { clearTimeout(plazo); window.removeEventListener('message', oir); }
    function oir(ev) {
      if (ev.source !== w || ev.origin !== origen || !ev.data || typeof ev.data !== 'object') return;
      if (ev.data.tipo === 'qsi-listo' && !listo) { listo = true; w.postMessage({ tipo: 'qsi-consulta', id: id, texto: texto }, origen); return; }
      if (ev.data.tipo === 'qsi-respuesta' && ev.data.id === id) { fin(); if (ev.data.error) rechazar(new Error(String(ev.data.error))); else resolver(String(ev.data.texto || '')); }
    }
    window.addEventListener('message', oir);
  });
}

/** Resuelve una consulta con Gemini Nano y la envia como si se hubiera pegado. Si no se puede, ofrece copiar y pegar. */
function resolverConNano(c) {
  c.ocupada = true;
  modal('<div class="pensando" style="padding:18px 4px"><i></i><span>Gemini Nano est\u00e1 pensando en tu computadora\u2026</span></div><p class="pequeno tenue">La primera vez Chrome puede tardar unos minutos en descargar el modelo.</p>', true);
  var pedir = S.nano && S.nano.estado === 'auxiliar' ? nanoAuxiliar(c.consulta) : nanoEnPagina(c.consulta);
  pedir.then(function (resp) {
    if (S.copia !== c) return null;
    var args = clonar(c.args);
    args.respuesta = resp;
    return llamar(c.ruta === 'cerrarEtapa' ? 'cerrarEtapa' : 'iaRespuesta', args).then(function (r) { S.copia = null; cerrarModal(); c.resolver(r); });
  }).catch(function (e) {
    if (S.copia !== c) return;
    c.ocupada = false;
    var porque = e && e.largo ? 'Esta consulta es demasiado larga para Gemini Nano.' : 'Gemini Nano no pudo responder' + (e && e.message ? ' (' + e.message + ')' : '') + '.';
    pintarCopia();
    errorCopia(porque + ' Puedes copiarla y pegarla en otro asistente, o usar tu clave propia.');
  });
}

// ------------------------------------------------------------------ Matriz de consistencia
function matrizDatos(exp) {
  var conH = exp.con_hipotesis !== 'NO';
  var pe = tablaDe(exp, 'problemas_especificos'), oe = tablaDe(exp, 'objetivos_especificos'), he = conH ? tablaDe(exp, 'hipotesis_especificas') : [];
  var filas = [{ nivel: 'General', problema: exp.problema_general || '', objetivo: exp.objetivo_general || '', hipotesis: conH ? (exp.hipotesis_general || '') : '' }];
  var n = Math.max(pe.length, oe.length, he.length);
  for (var i = 0; i < n; i++) filas.push({ nivel: 'Espec\u00edfico ' + (i + 1), problema: pe[i] ? pe[i].texto || '' : '', objetivo: oe[i] ? oe[i].texto || '' : '', hipotesis: he[i] ? he[i].texto || '' : '' });
  return { filas: filas, conH: conH, npe: pe.length, noe: oe.length, nhe: he.length, op: tablaDe(exp, 'operacionalizacion') };
}

  h += '<div class="tarjeta"><div class="pequeno tenue">T\u00edtulo</div><h2 style="margin-bottom:12px">' + (exp.titulo ? esc(exp.titulo) : '<span class="tenue">A\u00fan sin t\u00edtulo</span>') + '</h2><div class="desliza"><table class="tabla matriz" style="min-width:680px"><thead><tr><th></th><th>Problemas</th><th>Objetivos</th>' + (m.conH ? '<th>Hip\u00f3tesis</th>' : '') + '</tr></thead><tbody>' +

// ------------------------------------------------------------------ Mi plan
function seccionLlena(s, d, exp) {
  if (s.tipo === 'campo') return String(exp[s.fuente] || '').trim() ? 1 : 0;
  if (s.tipo === 'lista' || s.tipo === 'tabla') return tablaDe(exp, s.fuente).length ? 1 : 0;
  if (s.tipo !== 'especial') return -1;
  var f = s.fuente, cb = conteoBiblioteca(d.biblioteca);
  if (f === 'antecedentes_articulos') return cb.articulos ? 1 : 0;
  if (f === 'antecedentes_tesis') return cb.tesis ? 1 : 0;
  if (f === 'terminos') return tablaDe(exp, 'terminos').length ? 1 : 0;
  if (f === 'definiciones') return exp.defconc_v1 && exp.defconc_v2 ? 1 : 0;
  if (f === 'enfoque') return exp.enfoque && exp.enfoque_fund ? 1 : 0;
  if (f === 'diseno') return exp.diseno && exp.diseno_esquema ? 1 : 0;
  if (f === 'artefacto') return exp.artefacto_descripcion ? 1 : 0;
  if (f === 'evaluacion_artefacto') return exp.artefacto_evaluacion ? 1 : 0;
  if (f === 'cronograma' || f === 'presupuesto') return tablaDe(exp, f).length ? 1 : 0;
  if (f === 'matriz_consistencia') return exp.problema_general && exp.objetivo_general ? 1 : 0;
  if (f === 'esquema_artefacto') return exp.esquema_artefacto ? 1 : 0;
  if (f === 'arbol_problemas') return exp.problema_central ? 1 : 0;
  if (f === 'referencias') return d.biblioteca.length ? 1 : 0;
  return -1;
}

    var lleno = seccionLlena(s, d, exp);
    var t = String(s.titulo).split('{var1}').join(exp.var1 || 'Variable 1').split('{var2}').join(exp.var2 || 'Variable 2');

    h += '<div class="' + clase + '">' + (lleno < 0 ? '<span class="punto" style="visibility:hidden"></span>' : '<span class="punto' + (lleno ? ' ok' : '') + '" title="' + (lleno ? 'Con contenido' : 'Falta') + '"></span>') + (s.nivel === '1' ? '<b>' + esc(t) + '</b>' : esc((s.nivel === 'A' ? 'Anexo: ' : '') + t)) + '</div>';

// ------------------------------------------------------------------ Orientacion
// Resume el Taller de Titulacion por Tesis (las cuatro preguntas, la cadena, la metodologia y la validacion)
// y lo conecta con las etapas de la ruta y con lo que el estudiante ya escribio.

/** Eslabones de la cadena segun el tipo de proyecto: [nombre, que es, clave del campo que lo contiene]. */
function eslabones(exp) {
  if (exp.tipo_proyecto === 'artefacto') {
    return [
      ['Problema de impacto', 'Lo que alguien sufre hoy y se puede medir.', 'problema_central'],
      ['Brecha en la literatura', 'Lo que las soluciones existentes no resuelven.', 'declaracion_brecha'],
      ['Problema de dise\u00f1o', 'Lo que vas a construir, para qui\u00e9n y con qu\u00e9 criterio de \u00e9xito.', 'problema_diseno'],
      ['Artefacto', 'El software, modelo, m\u00e9todo o prototipo que propones.', 'artefacto_descripcion'],
      ['Afirmaci\u00f3n', 'Mi artefacto consigue X, mejor que Y, medido en Z.', 'afirmacion'],
      ['Pregunta de conocimiento', 'Lo que vas a averiguar midiendo: tu problema general.', 'problema_general'],
      ['M\u00e9todo de validaci\u00f3n', 'C\u00f3mo obtendr\u00e1s la evidencia.', 'metodo_validacion'],
      ['L\u00ednea base', 'Contra qu\u00e9 se compara: algo externo a tu artefacto.', 'linea_base'],
      ['L\u00edmites', 'D\u00f3nde no aplicar\u00eda el resultado y qu\u00e9 supuestos haces.', 'limites']
    ];
  }
  var l = [
    ['Problema de impacto', 'Lo que alguien sufre hoy y se puede medir.', 'problema_central'],
    ['Brecha en la literatura', 'Lo que los estudios previos no han respondido.', 'declaracion_brecha'],
    ['Pregunta de investigaci\u00f3n', 'Tu problema general: la relaci\u00f3n entre tus variables.', 'problema_general'],
    ['Objetivo', 'Lo que el estudio va a determinar.', 'objetivo_general']
  ];
  if (exp.con_hipotesis !== 'NO') l.push(['Hip\u00f3tesis', 'La respuesta que esperas y que los datos pueden refutar.', 'hipotesis_general']);
  l.push(['Dise\u00f1o', 'C\u00f3mo se observar\u00e1 o medir\u00e1 la relaci\u00f3n.', 'diseno']);
  l.push(['Evidencia', 'Con qu\u00e9 t\u00e9cnicas se analizan los datos.', 'analisis']);
  return l;
}
function valorEslabon(clave) {
  var c = campoDe(clave), v = String(S.exp[clave] || '').trim();
  if (!c || !v) return '';
  if (c.tipo === 'opcion') { for (var i = 0; i < c.opciones.length; i++) { if (c.opciones[i].valor === v) return c.opciones[i].texto; } }
  return v;
}
function botonEtapa(id, texto) {
  var e = etapaDe(id);
  if (!e) return '';
  return accesible(id) ? '<button class="btn chico" data-a="abrirEtapa" data-e="' + esc(id) + '">' + esc(texto || ('Ir a la etapa ' + id + ': ' + e.nombre)) + IC.flecha + '</button>' : '<span class="chip">' + IC.candado + 'Etapa ' + esc(id) + ': ' + esc(e.nombre) + '</span>';
}

function cadenaHtml() {
  var l = eslabones(S.exp), llenos = 0;
  var filas = l.map(function (x, i) {
    var c = campoDe(x[2]), v = valorEslabon(x[2]);
    if (v) llenos++;
    return '<tr><td class="or-n"><span class="' + (v ? 'ok' : '') + '">' + (i + 1) + '</span></td><td><b>' + esc(x[0]) + '</b><div class="pequeno tenue">' + esc(x[1]) + '</div></td>' +
      '<td>' + (v ? '<div class="or-tuyo">' + conMarcas(v.length > 260 ? v.substring(0, 260) + '\u2026' : v) + '</div>' : '<span class="chip ambar">Falta</span>') + '</td>' +
      '<td style="white-space:nowrap">' + (c && accesible(c.etapa) ? '<button class="btn chico fantasma" data-a="abrirEtapa" data-e="' + esc(c.etapa) + '">Etapa ' + esc(c.etapa) + IC.flecha + '</button>' : (c ? '<span class="pequeno tenue">Etapa ' + esc(c.etapa) + '</span>' : '')) + '</td></tr>';
  }).join('');
  var tira = l.map(function (x) { return '<span class="' + (valorEslabon(x[2]) ? 'ok' : '') + '">' + esc(x[0]) + '</span>'; }).join('<i>' + IC.flecha + '</i>');
  return '<div class="fila entre"><h2>Tu cadena, hasta hoy</h2><span class="chip ' + (llenos === l.length ? 'verde' : 'ambar') + '">' + llenos + ' de ' + l.length + ' eslabones</span></div>' +
    '<p class="tenue" style="margin:6px 0 12px">Es lo que deber\u00edas poder recitar en la sustentaci\u00f3n. Cada eslab\u00f3n se justifica con el anterior: si uno se cae, se cae la tesis.</p>' +
    '<div class="or-tira">' + tira + '</div><div class="desliza"><table class="tabla" style="min-width:640px"><tbody>' + filas + '</tbody></table></div>' +
    (S.exp.tipo_proyecto ? '' : '<p class="pequeno tenue" style="margin-top:10px">A\u00fan no eliges el tipo de proyecto en la etapa 0: se muestra la cadena de un proyecto explicativo.</p>');
}

var PROCESOS = ['Scrum', 'XP', 'RUP', 'un prototipado incremental', 'Mobile-D', 'CRISP-DM', 'KDD', 'la metodolog\u00eda de Kimball', 'Hefesto'];
function fraseHtml() {
  var o = S.orienta, cm = campoDe('metodo_validacion');
  var metodos = cm ? cm.opciones.map(function (x) { return x.valor; }) : ['Opini\u00f3n de expertos', 'Caso \u00fanico o experimento de mecanismo', 'Investigaci\u00f3n-acci\u00f3n t\u00e9cnica', 'Experimento estad\u00edstico de diferencia'];
  if (!o.proceso) o.proceso = PROCESOS[0];
  if (!o.metodo) o.metodo = (S.exp.metodo_validacion && metodos.indexOf(S.exp.metodo_validacion) >= 0) ? S.exp.metodo_validacion : metodos[metodos.length - 1];
  var lb = String(S.exp.linea_base || '').trim().split(/[.;:(]/)[0].trim();
  if (lb.length > 120) lb = lb.substring(0, 120) + '\u2026';
  var m = (/^(opini|investigaci)/i.test(o.metodo) ? 'la ' : 'el ') + o.metodo.charAt(0).toLowerCase() + o.metodo.substring(1);
  return '<div class="fila" style="align-items:flex-end;margin-bottom:10px"><div class="campo-simple" style="margin:0;width:230px"><label for="fr-proceso">Proceso de construcci\u00f3n</label><select id="fr-proceso" data-cambio="frase">' + PROCESOS.map(function (p) { return '<option' + (p === o.proceso ? ' selected' : '') + '>' + esc(p) + '</option>'; }).join('') + '</select></div>' +
    '<div class="campo-simple crece" style="margin:0;min-width:240px"><label for="fr-metodo">M\u00e9todo de validaci\u00f3n</label><select id="fr-metodo" data-cambio="frase">' + metodos.map(function (p) { return '<option' + (p === o.metodo ? ' selected' : '') + '>' + esc(p) + '</option>'; }).join('') + '</select></div></div>' +
    '<blockquote class="or-frase">\u00abMi metodolog\u00eda de investigaci\u00f3n es la ciencia del dise\u00f1o. Dentro de su fase de dise\u00f1o y desarrollo us\u00e9 <b>' + esc(o.proceso) + '</b> para organizar la construcci\u00f3n del artefacto, y en su fase de evaluaci\u00f3n lo compar\u00e9 contra una l\u00ednea base externa (<b>' + (lb ? esc(lb.charAt(0).toLowerCase() + lb.substring(1)) : 'la que definas en la etapa 5') + '</b>), con <b>' + esc(m) + '</b> como m\u00e9todo de validaci\u00f3n.\u00bb</blockquote>' +
    '<p class="pequeno tenue" style="margin-top:8px">' + (lb ? 'La l\u00ednea base sale de lo que escribiste en la etapa 5.' : 'Cuando escribas tu l\u00ednea base en la etapa 5, aparecer\u00e1 aqu\u00ed.') + ' La frase que no funciona es la habitual: \u00abmi metodolog\u00eda es Scrum\u00bb. Scrum organiza el trabajo; no responde si lo construido es mejor que lo que ya exist\u00eda.</p>';
}
function pintarFrase() {
  var p = $('#fr-proceso'), m = $('#fr-metodo'), cont = $('#or-frase');
  if (!cont) return;
  if (p) S.orienta.proceso = p.value;
  if (m) S.orienta.metodo = m.value;
  cont.innerHTML = fraseHtml();
}

function vistaOrientacion() {
  var d = S.d, c = d.config, art = S.exp.tipo_proyecto === 'artefacto', cr = S.info.credito || {};
  var bru = enlace(c.BRUJULA_URL), taller = enlace(c.TALLER_URL);
  var cm = campoDe('metodo_validacion');
  function seccion(id, cuerpo) { return '<section class="tarjeta or-sec" id="or-' + id + '">' + cuerpo + '</section>'; }
  function pregunta(id, n, titulo, etapa, cuerpo) {
    return seccion(id, '<div class="or-preg"><b class="or-num">' + n + '</b><div><div class="pequeno tenue" style="text-transform:uppercase;letter-spacing:.06em;font-weight:600">Pregunta ' + n + '</div><h2>' + titulo + '</h2></div><span style="margin-left:auto">' + botonEtapa(etapa) + '</span></div>' + cuerpo);
  }
  function plantilla(titulo, sub, lineas, ejemplo, nota) {
    return '<div class="or-plantilla"><b>' + titulo + '</b><div class="pequeno tenue">' + sub + '</div><pre>' + lineas.map(esc).join('\n') + '</pre><p class="pequeno"><b>Ejemplo:</b> ' + ejemplo + '</p>' + (nota ? '<p class="pequeno tenue" style="margin-top:6px">' + nota + '</p>' : '') + '</div>';
  }
  function error(titulo, texto) { return '<div class="or-error"><span class="chip rojo">' + IC.alerta + 'Error de la catapulta</span><div><b>' + titulo + '</b> ' + texto + '</div></div>'; }

  var h = '<div class="cabecera"><h1>Orientaci\u00f3n</h1><p>Antes de llenar formatos, una tesis de Ingenier\u00eda de Sistemas responde cuatro preguntas, en este orden: cu\u00e1l es el problema, qu\u00e9 ya existe, qu\u00e9 construyes o propones y con qu\u00e9 lo demuestras. Aqu\u00ed est\u00e1 el resumen del Taller de Titulaci\u00f3n por Tesis y la etapa de tu ruta donde se trabaja cada cosa.</p></div>';
  h += '<div class="rejilla dos"><div class="pila">';

  // ---- por donde empezar
  h += seccion('empezar', '<h2>Por d\u00f3nde empezar</h2><div class="or-pasos">' +
    '<div><b class="or-num chico">1</b><div><h3>Si a\u00fan no tienes tema, usa la Br\u00fajula de Tesis</h3><p class="tenue">Te ayuda a ubicar un \u00e1rea, una l\u00ednea y subl\u00edneas de investigaci\u00f3n. Cuando termines, pega su recomendaci\u00f3n en el primer campo de la etapa 0 y \u00fasala para escribir tu tema con tus palabras.</p></div></div>' +
